<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift & Run">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Lift & Run Log</title>
<style>
:root{--bg:#0f1216;--card:#171c22;--line:#262d36;--text:#e8edf2;--mute:#8b97a5;--acc:#ef4444;--acc2:#fb923c;--warn:#fbbf24;--r:16px;--ease:cubic-bezier(.2,.9,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
header{padding:calc(20px + env(safe-area-inset-top)) 20px 10px;max-width:640px;margin:0 auto}
header h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.8px;line-height:1.1}
header span{display:block;color:var(--mute);font-size:14px;margin-top:4px;min-height:20px}
body.wk header{display:none}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
main{padding:6px 16px 28px;max-width:640px;margin:0 auto}
body.wk main{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
nav{flex:none;display:flex;background:#0c0f13;border-top:1px solid var(--line);padding-bottom:min(env(safe-area-inset-bottom),34px);z-index:5}
body.wk nav{display:none}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--mute);padding:12px 0 10px;font-size:12px;font-weight:700;letter-spacing:.2px;transition:color .2s}
nav button svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
nav button.on{color:var(--acc)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}
nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 5px 5px;background:var(--acc)}
.week{padding:12px 10px 14px}
.wkhd{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.wkhd b{font-size:14px}
.wkhd button{background:none;border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{background:none;border:2px solid transparent;border-radius:14px;padding:8px 0 7px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.days small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.days b{font-size:18px;color:var(--text)}
.days i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.days button.done i{background:var(--acc);box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.days button.sel{border-color:var(--acc);background:rgba(239,68,68,.1)}
.days button.today b{color:var(--acc)}
select.big{height:52px;font-weight:600}
button{font-family:inherit;cursor:pointer;transition:transform .12s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.95)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
select,input,textarea{width:100%;background:#0f1318;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:transparent}
.note{color:var(--mute);font-size:13px;margin-top:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn.big{padding:18px;font-size:19px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#223;color:var(--acc2);margin-left:6px;vertical-align:middle}
.pill.loc{background:#2a2210;color:var(--warn)}
.hist .top{display:flex;justify-content:space-between;gap:8px}
.hist h3{margin:0;font-size:16px}
.hist .d{color:var(--mute);font-size:13px}
.hist details summary{cursor:pointer;list-style:none}
.hist details summary::-webkit-details-marker{display:none}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ln b{font-weight:600}.ln span{color:var(--mute);text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#e8edf2;color:#0f1216;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:.25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.wk .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-10px)}
body.wk .toast.show{transform:translate(-50%,0)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
svg{display:block}
.chart{width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500;font-size:12px;border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:20px}.stat span{color:var(--mute);font-size:12px}

/* ---- start card ---- */
.hero{background:linear-gradient(160deg,#2a1416,#171c22 60%);border:1px solid #4a2226;border-radius:20px;padding:20px;margin:12px 0;animation:rise .4s var(--ease)}
.hero h2{margin:0 0 4px;font-size:26px;letter-spacing:-.4px}
.hero .meta{color:var(--mute);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chips span{background:#0f1318;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--mute)}
.chips span.ok{border-color:var(--acc);color:var(--acc)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---- workout flow ---- */
.wkTop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{background:#171c22;border:1px solid var(--line);color:var(--mute);width:36px;height:36px;border-radius:12px;font-size:18px;flex:none}
.seg{display:flex;gap:5px;flex:1}
.seg i{flex:1;height:7px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
.seg i::after{content:"";position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.seg i.done::after{transform:scaleX(1)}
.seg i.now{background:#415062}
.stage{animation:inR .3s var(--ease)}
.stage.l{animation-name:inL}
.stage.noanim{animation:none}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.kicker{color:var(--mute);font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.stage h2{margin:2px 0 4px;font-size:27px;line-height:1.15;letter-spacing:-.4px}
.tgt{color:var(--mute);font-size:14px}
.last{font-size:13px;margin-top:10px;color:var(--acc2)}
.last .hint{color:var(--warn);display:block;margin-top:2px}
.badge{display:inline-block;margin-top:8px;background:#2b2410;color:var(--warn);border:1px solid #5a4a14;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;animation:badge .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes badge{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.dot{min-width:56px;padding:9px 10px;border-radius:14px;border:2px dashed var(--line);text-align:center;font-size:13px;font-weight:600;color:var(--mute);background:transparent}
.dot.done{border:2px solid var(--acc);color:var(--text);background:rgba(239,68,68,.1)}
.dot.now{border:2px solid var(--acc2);color:var(--acc2);animation:glow 1.6s ease-in-out infinite}
.dot.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.4);background:rgba(239,68,68,.6)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(251,146,60,.14)}}
.steppers{display:grid;grid-template-columns:1fr;gap:12px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 14px}
.stp .lbl{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase;text-align:center;margin-bottom:6px}
.stp .ctl{display:flex;align-items:center;gap:10px}
.stp button{flex:none;width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:#0f1318;color:var(--text);font-size:30px;font-weight:300;line-height:1}
.stp button:active{background:#2a1717;border-color:var(--acc)}
.stp input{flex:1;min-width:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1px;background:transparent;border:0;padding:0;height:62px}
.stp input:focus{outline:0}
.stp input.bump{animation:bump .18s var(--ease)}
@keyframes bump{50%{transform:scale(1.12);color:var(--acc)}}
.stp .unit{text-align:center;color:var(--mute);font-size:12px;margin-top:2px}
.rest{display:flex;align-items:center;gap:14px;background:#241512;border:1px solid #4a2a1c;border-radius:16px;padding:10px 14px;margin:12px 0 0;animation:rise .3s var(--ease)}
.rest .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rest .s{color:var(--mute);font-size:13px}
.rest button{margin-left:auto;background:none;border:1px solid #6b3a22;color:var(--acc2);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:#3a2417}
.ring .fg{stroke:var(--acc2);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.logwrap{margin-top:14px}
.btn.log{box-shadow:0 8px 24px rgba(239,68,68,.22)}
.btn.log.ok{animation:ok .55s var(--ease)}
@keyframes ok{0%{transform:scale(1)}30%{transform:scale(.94)}60%{transform:scale(1.04);filter:brightness(1.2)}100%{transform:scale(1)}}
.btn.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nav3{display:flex;gap:10px;margin-top:12px}
.nav3 button{flex:1}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(239,68,68,.2);transform:scale(1.02)}}
.link{background:none;border:0;color:var(--mute);font-size:13px;padding:10px 6px;text-decoration:underline}
.moods{display:flex;gap:8px;margin:6px 0 14px}
.moods button{flex:1;font-size:26px;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.moods button.on{border-color:var(--acc);background:rgba(239,68,68,.12);transform:scale(1.07)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.sum .stat{padding:12px 14px}.sum .stat b{font-size:28px}
.sum .stat{animation:rise .45s var(--ease) backwards}
.sum .stat:nth-child(2){animation-delay:.07s}.sum .stat:nth-child(3){animation-delay:.14s}.sum .stat:nth-child(4){animation-delay:.21s}
.burst{position:fixed;z-index:40;pointer-events:none}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;animation:fly 1.05s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),calc(var(--dy) + 130px)) rotate(var(--r));opacity:0}}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hdr .btn{flex:none;margin-top:4px}
.sug{margin-top:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:9px 12px;font-size:15px}
.sug small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#161b21;border-radius:24px 24px 0 0;width:100%;max-width:640px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .3s var(--ease)}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .note{margin-bottom:12px}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;font-weight:600;text-align:left}
.opt.cur{border-color:var(--acc);background:rgba(239,68,68,.1)}
.opt small{color:var(--mute);font-weight:500}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.dl{border-color:#5a4a14;background:#221d0d}
.tools2{display:flex;gap:8px;margin-top:10px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row2 .btn{flex:none;min-width:64px}
.sep{height:1px;background:var(--line);margin:14px 0}
.set summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.set summary::-webkit-details-marker{display:none}
.set summary span{color:var(--mute);font-size:14px}

.sect{font-size:13px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);margin:26px 4px 8px}
.sect:first-child{margin-top:8px}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .dn{width:36px;font-weight:800;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.dayrow .dt{flex:1;font-weight:600}
.dayrow.now{background:rgba(239,68,68,.09);border-radius:12px;border-top-color:transparent}
.dayrow.now+.dayrow{border-top-color:transparent}
.dayrow.now .dn{color:var(--acc)}
.tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#222a33;color:var(--mute)}
.tag.lift{background:rgba(239,68,68,.16);color:#ff8f8f}
.tag.run{background:rgba(251,146,60,.16);color:var(--acc2)}
.pl{padding:0}
.pl>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
.pl>summary::-webkit-details-marker{display:none}
.pl .ttl{flex:1}
.pl .ttl b{display:block;font-size:17px}
.pl .ttl span{color:var(--mute);font-size:13px}
.chev{color:var(--mute);font-size:22px;line-height:1;transition:transform .25s var(--ease)}
details[open]>summary .chev{transform:rotate(90deg)}
.pl .body{padding:0 16px 8px}
.exr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.exn{font-weight:600;line-height:1.3}
.exn i{display:inline-block;font-style:normal;font-size:10px;color:var(--acc);border:1px solid rgba(239,68,68,.5);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:800;letter-spacing:.3px;vertical-align:middle}
.exs{text-align:right;white-space:nowrap;font-weight:800}
.exs small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:1px}
.bul{margin:0;padding:0;list-style:none}
.bul li{padding:10px 0 10px 22px;position:relative;color:var(--text);border-top:1px solid var(--line);font-size:15px}
.bul li:first-child{border-top:0}
.bul li::before{content:"";position:absolute;left:4px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 8px}
.wkhead:first-child{margin-top:8px}
.wkhead b{font-size:13px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute)}
.wkhead span{font-size:13px;color:var(--mute)}
.wo{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:16px;margin:10px 0;overflow:hidden}
.wo.run{border-left-color:var(--acc2)}
.wo.yoga{border-left-color:var(--warn)}
.wo>details>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer}
.wo>details>summary::-webkit-details-marker{display:none}
.wdate{flex:none;width:46px;text-align:center;background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.wdate small{display:block;font-size:10px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.wdate b{font-size:20px;line-height:1.1}
.wmain{flex:1;min-width:0}
.wt{font-weight:700;font-size:16px}
.wm{color:var(--mute);font-size:13px;margin-top:2px}
.wbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.wex{padding:11px 0;border-top:1px solid var(--line)}
.wex:first-child{border-top:0}
.wex b{display:block;font-size:14px;margin-bottom:6px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.sc{background:#0f1318;border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.wnote{margin-top:10px;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--mute);font-size:14px;font-style:italic}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:12px 0 4px}
.rstats div{display:flex;flex-direction:column}.rstats b{font-size:18px}.rstats span{color:var(--mute);font-size:12px}
.wsum{display:flex;gap:16px;color:var(--mute);font-size:13px;padding:10px 0 4px}
.wsum b{color:var(--text)}
.hero.doneh{background:linear-gradient(160deg,#2a1416,#171c22 65%);border-color:rgba(239,68,68,.55)}
.chk{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:12px;animation:badge .6s cubic-bezier(.3,1.7,.5,1);box-shadow:0 6px 20px rgba(239,68,68,.35)}
.sum3{grid-template-columns:repeat(3,1fr);margin:14px 0 18px}
.sum3 .stat b{font-size:22px}
.donebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px}
.donebar>span{color:var(--mute);font-size:13px;font-weight:700;margin-right:2px}
.donebar em{font-style:normal;font-size:13px;font-weight:700;background:rgba(239,68,68,.14);color:#ff9a9a;border-radius:99px;padding:4px 11px}
.schhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 4px 8px}
.schhd b{font-size:13px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute)}
.schhd span{font-size:13px;color:var(--mute);text-align:right}
.schips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 4px;padding:2px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.schips::-webkit-scrollbar{display:none}
.sch{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:11px 17px;font-size:15px;font-weight:700;white-space:nowrap}
.sch.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.3)}
.sch.done:not(.on){border-color:rgba(239,68,68,.45);color:#ff9a9a}
.recap{margin:4px 0 2px;border-top:1px solid rgba(255,255,255,.08)}
.recap>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer;font-weight:700}
.recap>summary::-webkit-details-marker{display:none}
.recap .wbody{padding:0 0 4px;border-top:0}

/* ---------- state ---------- */
const st = {

const contentOf = x => canon({entries:x.entries||null,run:x.run||null,yoga:x.yoga||null,energy:x.energy??null,notes:x.notes||null,durationMin:x.durationMin??null,deload:!!x.deload,hk:x.hk||null});

const isLocalOnly = s => !st.repo.some(r=>r.id===s.id && contentOf(r)===contentOf(s));

/* ---------- draft ---------- */
function getDraft(){
  const id=sid(), ex=allSessions().find(s=>s.id===id);

  if(!st.draft[id] || (ex && !st.draft[id].touched)) st.draft[id] = ex ? fromSession(ex) : {ex:{},energy:'',notes:'',run:{dist:'',min:''},swaps:{},deload:false};

}
function fromSession(s){

/* ---------- smart targets, deload, weekly stats ---------- */
const roundTo = (v,q) => Math.round(v/q)*q;
const monOf = ds => addDays(ds, -((new Date(ds+'T12:00:00').getDay()+6)%7));
function suggestFor(e){
  const hist=[];
  for(const s of allSessions()){
    if(s.id===sid()||s.date>st.date) continue;
    const en=(s.entries||[]).find(x=>x.id===e.id);
    if(en&&en.sets.length) hist.push(en.sets);
    if(hist.length>=2) break;
  }
  if(!hist.length) return null;
  const dl=getDraft().deload, q=e.small?2.5:5, lo=e.reps[0], hi=e.reps[1];
  const topOf = sets => { const mw=Math.max(...sets.map(x=>x.w||0)); return {w:mw, minR:Math.min(...sets.filter(x=>(x.w||0)===mw).map(x=>x.r))} };
  const {w,minR}=topOf(hist[0]);

  if(hist.length>1 && topOf(hist[0]).minR<lo && topOf(hist[1]).minR<lo) return {w:roundTo(w*0.9,q), r:lo, why:'Missed the rep range twice. Drop about 10% and rebuild'};
  const r = minR<lo ? lo : Math.min(hi,minR+1);
  return {w, r, why: minR<lo ? `Same weight, get to ${lo}+ reps` : `Same weight, aim for ${r} reps`};
}
function deloadInfo(){

  });
  const cur=monOf(st.date), gap=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/604800000);
  let streak=0, prev=null;
  [...weeks.keys()].filter(k=>k<cur).sort().forEach(k=>{
    if(prev && gap(prev,k)>2) streak=0;
    const o=weeks.get(k); streak = (o.dl&&!o.normal) ? 0 : streak+1; prev=k;

}

async function sbUpsert(list){

    const t=await sbToken(); const uid=t&&jwtSub(t); if(!uid) return false;
    const r=await sbFetch('/rest/v1/sessions?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(list.map(x=>sessToRow(x,uid)))});

async function reconcile(){

  if(toSb.length) await sbUpsert(toSb);

/* Delete a saved workout from this device, Supabase and GitHub. */
async function deleteWorkout(id){
  const t=tombs(); t[id]=Date.now(); SS('wt.deleted.v1',t);
  st.local=st.local.filter(x=>x.id!==id); SS('wt.local.v1',st.local);
  delete st.draft[id]; SS('wt.draft.v1',st.draft);
  render(); toast('Workout deleted');
  await purgeDeleted();
}
let purging=false;
async function purgeDeleted(){
  if(purging) return; purging=true;
  try{
    const dead = l => l.filter(isDeleted).map(x=>x.id);
    const sbIds=dead(st.sb);
    if(sbIds.length && sbAuth()){
      const r=await sbFetch('/rest/v1/sessions?id=in.('+sbIds.map(i=>'"'+i+'"').join(',')+')',{method:'DELETE'});
      if(r.ok) st.sb=st.sb.filter(x=>!sbIds.includes(x.id));
    }
    const tok=getToken();
    if(tok && dead(st.repo).length){
      for(let attempt=0;attempt<3;attempt++){
        const cur=await ghGet(tok), ids=dead(cur.arr);
        if(!ids.length){ st.repo=cur.arr; break }
        const kept=cur.arr.filter(x=>!ids.includes(x.id));
        const res=await ghPut(tok,kept,cur.sha,'Delete workout: '+ids.join(', '));
        if(res.status===409||res.status===422) continue;
        if(res.ok) st.repo=kept;
        break;
      }
    }
  }catch(e){}
  purging=false;
}
const restOn = () => LS('wt.rest', false);
const b64enc = str => { const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode(...bytes.subarray(i,i+8192)); return btoa(bin) };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ghHeaders = tok => ({Authorization:'Bearer '+tok, Accept:'application/vnd.github+json'});
const ghUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${LOGPATH}`;
async function ghGet(tok){
  const r=await fetch(ghUrl+'?ref=main&t='+Date.now(),{headers:ghHeaders(tok),cache:'no-store'});
  if(r.status===404) return {arr:[],sha:undefined};
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); let arr=[]; try{arr=JSON.parse(b64dec(j.content))}catch(e){}
  return {arr:Array.isArray(arr)?arr:[], sha:j.sha};
}
async function ghPut(tok,arr,sha,message){
  return fetch(ghUrl,{method:'PUT',headers:{...ghHeaders(tok),'Content-Type':'application/json'},
    body:JSON.stringify({message,content:b64enc(JSON.stringify(arr,null,1)+'\n'),branch:'main',...(sha?{sha}:{})})});
}
let syncing=false;
async function syncNow(manual){
  const tok=getToken();
  if(!tok){ if(manual) toast('Add your GitHub token first'); return false }
  if(!st.local.length){ if(manual) toast('Already synced'); return true }
  if(syncing) return false;
  syncing=true; let ok=false;
  try{
    for(let attempt=0;attempt<3&&!ok;attempt++){
      const cur=await ghGet(tok), m=new Map();
      cur.arr.forEach(s=>m.set(s.id,s)); st.local.forEach(s=>m.set(s.id,s));
      const merged=[...m.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      const res=await ghPut(tok,merged,cur.sha,'Log workout: '+st.local.map(s=>s.id).join(', '));
      if(res.status===409||res.status===422) continue;
      if(res.status===401||res.status===403||res.status===404) throw new Error('Token not allowed to write to the repo');
      if(!res.ok) throw new Error('HTTP '+res.status);
      st.repo=merged; st.local=[]; SS('wt.local.v1',st.local); ok=true;
    }
    toast(ok?'Synced to GitHub ☁️':'Sync failed. Saved on this phone');
  }catch(e){ toast('Sync failed. Saved on this phone') }
  syncing=false;
  if(!st.wk) render();
  return ok;
}
async function connectToken(){
  const el=$('#tok'), tok=(el&&el.value||'').trim();
  if(!tok) return toast('Paste your token first');
  try{
    const r=await fetch(ghUrl+'?ref=main',{headers:ghHeaders(tok),cache:'no-store'});
    if(r.status===401||r.status===403) return toast('GitHub rejected that token');
    if(!r.ok&&r.status!==404) return toast('Could not reach GitHub ('+r.status+')');
    SS('wt.token',tok); toast('Connected ✅'); await loadRepo(); syncNow();
  }catch(e){ toast('No connection. Try again online') }
}

/* ---------- workout flow ---------- */
const stepsFor = () => {
  const S=PLAN.sessions[sessBase(st.sess)];
  return S.type==='lift' ? S.ex.map(e=>{const a=getDraft().swaps[e.id];return a&&EXMAP[a]?EXMAP[a]:e}) : S.type==='run' ? [{id:'run',run:1,name:sessName(st.sess)}] : S.type==='yoga' ? [{id:'yoga',yoga:1,name:S.name}] : [];
};
function startWorkout(resume){
  const d=getDraft(); if(!d.startedAt){d.startedAt=Date.now();saveDraft()}
  const steps=stepsFor();
  let first=0;
  if(resume){ const i=steps.findIndex(e=>!e.run && (d.ex[e.id]||[]).length<e.sets); first = i<0? steps.length : i }
  st.wk={step:first,dir:1,anim:true,editing:null,just:null,rest:null,cur:null,prs:{}};
  initCur(); document.body.classList.add('wk'); render(); toTop();
}
function exitWorkout(){ clearRest(); st.wk=null; document.body.classList.remove('wk'); render(); toTop() }
function goStep(i,dir){
  const steps=stepsFor(); const n=steps.length;
  st.wk.step=Math.max(0,Math.min(n,i)); st.wk.dir=dir; st.wk.anim=true; st.wk.editing=null; st.wk.just=null;
  clearRest(); initCur(); render(); toTop();
}
function initCur(){
  const e=stepsFor()[st.wk.step]; if(!e||e.run||e.yoga){ if(e&&e.yoga){const d0=getDraft(); if(d0.run.min===''){d0.run.min=60;saveDraft()}} st.wk.cur=null;return}
  const a=getDraft().ex[e.id]||[], last=lastFor(e.id), sug=suggestFor(e);
  const src = st.wk.editing!=null ? a[st.wk.editing] : (a[a.length-1] || (sug?{w:sug.w,r:sug.r}:null) || last?.sets[last.sets.length-1]);
  st.wk.cur={w:src?.w??0, r:src?.r ?? e.reps[0]};
}
let restTimer=null;
function clearRest(){ clearInterval(restTimer); restTimer=null; if(st.wk) st.wk.rest=null }
function startRest(secs){
  clearInterval(restTimer);
  st.wk.rest={end:Date.now()+secs*1000,total:secs};
  restTimer=setInterval(tickRest,250);
}
function tickRest(){
  const r=st.wk&&st.wk.rest; if(!r){clearInterval(restTimer);return}
  const left=Math.ceil((r.end-Date.now())/1000);
  if(left<=0){ clearRest(); buzz([60,60,60]); toast('Rest done. Go time'); render(); return }
  const t=$('#restT'), fg=$('#restFg');
  if(t) t.textContent=mmss(left);
  if(fg) fg.style.strokeDashoffset=String(100.5*(1-left/r.total));
}

function logSet(){
  const wk=st.wk, e=stepsFor()[wk.step], d=getDraft(), a=(d.ex[e.id] ||= []);
  const w=num(wk.cur.w)||0, r=num(wk.cur.r);
  const btn=$('#logBtn');
  if(!r||r<=0){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); return }
  const idx = wk.editing!=null ? wk.editing : a.length;
  const prior = Math.max(bestEver(e.id), ...a.filter((_,i)=>i!==idx).map(x=>x.w||0), 0);
  const isPR = w>0 && prior>0 && w>prior;
  const nowT=Date.now(); if(!d.firstAt) d.firstAt=nowT; d.lastAt=nowT;
  a[idx]={w,r}; saveDraft();
  const wasEdit = wk.editing!=null;
  wk.editing=null; wk.just=idx;
  if(isPR){ wk.prs[e.id]=true; burstAt(btn,44); buzz([30,40,30]); toast('New PR 🏆') }
  else { burstAt(btn,10); buzz(15); toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]) }
  if(!wasEdit && a.length<e.sets && restOn()) startRest(restSecs(e.rest)); else clearRest();
  wk.cur={w,r};

}

function woBody(x,kind,compact){
  let body='';
  if(kind==='lift'){
    const st3=sessStats(x);
    if(!compact) body += `<div class="wsum"><span><b>${st3[0][0]}</b> sets</span><span><b>${st3[1][0]}</b> lb lifted</span>${x.deload?'<span>deload week</span>':''}</div>`;
    body += (x.entries||[]).map(e=>`<div class="wex"><b>${esc(e.name)}</b><div class="chips2">${e.sets.map(t=>`<span class="sc">${esc(fmtSet(t))}</span>`).join('')}</div></div>`).join('');
  } else if(kind==='run'){
    body += runStats(x);
  } else if(!compact) body += `<div class="wsum"><span><b>${x.yoga.minutes??'—'}</b> minutes of hot yoga</span></div>`;
  if(x.notes) body += `<div class="wnote">${esc(x.notes)}</div>`;
  return body;
}
/* Run stats grid: always shown, including Watch extras (heart rate, energy, climb) when present. */
function runStats(x){
  const r=x.run||{}, hk=x.hk||{}, cells=[];
  const pace = x.avgPaceSecPerKm || ((r.distanceKm&&r.minutes) ? Math.round(r.minutes*60/r.distanceKm) : null);
  cells.push([r.distanceKm??'—','km'],[r.minutes!=null?mmss(Math.round(r.minutes*60)):'—','time'],[pace?mmss(pace):'—','/km pace']);
  if(hk.avgHR) cells.push([hk.avgHR,'avg bpm']);
  if(hk.maxHR) cells.push([hk.maxHR,'max bpm']);
  if(hk.activeKcal) cells.push([hk.activeKcal,'kcal']);
  if(x.elevationGainM!=null) cells.push([Math.round(x.elevationGainM),'m climb']);
  return `<div class="rstats">${cells.map(([v,l])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>`;
}
function viewHistory(){

  const thisMon=monOf(todayStr()), lastMon=addDays(thisMon,-7), groups=new Map();

  const rng = m => { const f=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); return f(m)+' – '+f(addDays(m,6)) };
  groups.forEach((list,mon)=>{

const paceStr = r => (r.distanceKm&&r.minutes) ? (()=>{const p=r.minutes/r.distanceKm;return ` (${Math.floor(p)}:${String(Math.round((p%1)*60)).padStart(2,'0')}/km)`})() : '';

function viewProgress(){
  const have=new Set(); allSessions().forEach(s=>(s.entries||[]).forEach(e=>have.add(e.id)));
  const exs=Object.values(EXMAP).filter(e=>!e.alt||have.has(e.id));
  if(!st.progEx || !EXMAP[st.progEx]) st.progEx = (exs.find(e=>have.has(e.id))||exs[0]).id;
  const pts=[];
  [...allSessions()].reverse().forEach(s=>{
    const e=(s.entries||[]).find(x=>x.id===st.progEx); if(!e) return;
    const top = e.sets.reduce((m,x)=> (x.w||0)>(m.w||0)?x:m, e.sets[0]);
    const vol = e.sets.reduce((a,x)=>a+(x.w||0)*(x.r||0),0);
    pts.push({date:s.date, w:top.w||0, r:top.r, vol, e1:Math.round((top.w||0)*(1+top.r/30))});
  });
  let h = weeklyHtml() + `<div class="card"><label class="f">Exercise</label><select id="progEx">${exs.map(e=>`<option value="${e.id}" ${e.id===st.progEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>`;
  if(!pts.length) return h+`<div class="empty">No data for this exercise yet.</div>`;
  h += `<div class="card"><div class="stats"><div class="stat"><b>${Math.max(...pts.map(p=>p.w))} lb</b><span>Heaviest set</span></div>
    <div class="stat"><b>${Math.max(...pts.map(p=>p.e1))}</b><span>Est. 1RM</span></div>

}
function weeklyHtml(){
  const mon=monOf(todayStr()), w=weekStats(mon);
  const weeks=Array.from({length:8},(_,i)=>{const m=addDays(mon,-7*(7-i)); return {m,...weekStats(m)}});
  const pips=Array.from({length:5},(_,i)=>`<i class="${i<w.sessions?'on':''}"></i>`).join('');
  const run = w.km ? w.km.toFixed(1)+' km' : (w.min? w.min+' min':'0 km');
  return `<div class="card"><div class="kicker2">This week</div>
    <div class="wbig"><b>${w.sessions}</b> of 5 sessions</div><div class="pips">${pips}</div>
    <div class="stats"><div class="stat"><b>${w.lifts}/4</b><span>Lifts</span></div><div class="stat"><b>${run}</b><span>Running</span></div><div class="stat"><b>${(w.volume/1000).toFixed(1)}k</b><span>lb lifted</span></div></div>
    ${w.yogaN?`<div class="note" style="margin-top:10px">🔥 Hot yoga: ${w.yogaN} class${w.yogaN>1?'es':''}, ${w.yogaMin} min</div>`:''}
    <div style="margin-top:14px"><div class="kicker2" style="margin-bottom:4px">Last 8 weeks · lb lifted</div>${weeksChart(weeks)}</div></div>`;
}
function weeksChart(weeks){
  const W=320,H=132,P=22, max=Math.max(...weeks.map(w=>w.volume),1), bw=(W-2*P)/weeks.length;
  if(weeks.every(w=>!w.sessions)) return `<div class="note" style="padding:14px 0">Log a few workouts and your weekly totals will show up here.</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume for the last 8 weeks">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#262d36"/>
    ${weeks.map((w,i)=>{
      const x=P+i*bw+5, bh=Math.round((w.volume/max)*(H-2*P-14)), cur=i===weeks.length-1, y=H-P-bh;
      return `<rect x="${x}" y="${y}" width="${bw-10}" height="${Math.max(bh,w.sessions?3:0)}" rx="5" fill="${cur?'#ef4444':'#6b2b2b'}"/>
        ${w.sessions?`<text x="${x+(bw-10)/2}" y="${y-4}" fill="#e8edf2" font-size="10" text-anchor="middle">${w.sessions}</text>`:''}
        <text x="${x+(bw-10)/2}" y="${H-7}" fill="#8b97a5" font-size="9" text-anchor="middle">${new Date(w.m+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</text>`;
    }).join('')}</svg>`;
}
function chart(pts){
  const W=320,H=150,P=26, ys=pts.map(p=>p.w), lo=Math.min(...ys), hi=Math.max(...ys), span=(hi-lo)||1;
  const x=i=>pts.length===1?W/2:P+i*(W-2*P)/(pts.length-1), y=v=>H-P-((v-lo)/span)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top set weight over time">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#262d36"/>
    <path d="${path}" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3.5" fill="#ef4444"/>`).join('')}
    <text x="${P}" y="14" fill="#8b97a5" font-size="11">${hi} lb</text><text x="${P}" y="${H-8}" fill="#8b97a5" font-size="11">${lo} lb</text>
    <text x="${W-P}" y="${H-8}" fill="#8b97a5" font-size="11" text-anchor="end">${fmtDate(pts[pts.length-1].date)}</text></svg>`;
}

/* ---------- events ---------- */
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.tab=b.dataset.tab;render();toTop()});
const app=$('#app');
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='date'){st.date=t.value||todayStr();st.sess=defaultSession(st.date);render()}
  else if(t.id==='sess'){st.sess=t.value;render()}
  else if(t.id==='progEx'){st.progEx=t.value;render()}
});
function fldObj(f){ return (f==='dist'||f==='min') ? getDraft().run : st.wk.cur }
function paceUpdate(){
  const d=getDraft(), el=$('#pace'); if(!el) return;
  const p=(num(d.run.dist)&&num(d.run.min))?d.run.min/d.run.dist:null;
  el.textContent=p?`${Math.floor(p)}:${String(Math.round((p%1)*60)).padStart(2,'0')} /km`:'—';
}
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='notes'){getDraft().notes=t.value;saveDraft()}
  else if(t.dataset.fld&&st.wk){
    const f=t.dataset.fld, o=fldObj(f); o[f]=t.value===''?'':t.value;
    if(f==='dist'||f==='min'){saveDraft();paceUpdate()}
  }
});
app.addEventListener('focusin',e=>{ if(e.target.dataset&&e.target.dataset.fld) e.target.select() });
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, wk=st.wk;
  if(act==='day'){ st.date=b.dataset.d; st.sess=defaultSession(st.date); render() }
  else if(act==='wk'){ st.date=addDays(st.date,+b.dataset.n); st.sess=defaultSession(st.date); render() }
  else if(act==='sess'){ st.sess=b.dataset.k; render() }
  else if(act==='edit') startWorkout(false);
  else if(act==='start') startWorkout(b.dataset.resume==='1');
  else if(act==='exit') exitWorkout();
  else if(act==='jump') goStep(+b.dataset.i, +b.dataset.i>=wk.step?1:-1);
  else if(act==='back') goStep(wk.step-1,-1);
  else if(act==='next') goStep(wk.step+1,1);
  else if(act==='runnext'){
    const d=getDraft(); if(num(d.run.dist)==null&&num(d.run.min)==null){const bt=$('#logBtn');bt.classList.remove('shake');void bt.offsetWidth;bt.classList.add('shake');return}
    saveDraft(); burstAt(b,24); buzz(20); goStep(wk.step+1,1);
  }
  else if(act==='step'){
    const f=b.dataset.f, dir=+b.dataset.dir, e=stepsFor()[wk.step], o=fldObj(f);
    const stepSize = f==='w'?(e.small?2.5:5) : f==='dist'?0.5 : (f==='min'&&e.yoga?5:1);
    const cur=num(o[f])||0, nv=Math.max(0, Math.round((cur+dir*stepSize)*100)/100);
    o[f]=nv; const inp=document.querySelector(`[data-fld="${f}"]`);
    inp.value=nv; inp.classList.remove('bump'); void inp.offsetWidth; inp.classList.add('bump');
    buzz(5); if(f==='dist'||f==='min'){saveDraft();paceUpdate()}
  }
  else if(act==='log') logSet();
  else if(act==='dot'){
    const i=+b.dataset.i, a=getDraft().ex[stepsFor()[wk.step].id]||[];
    wk.editing = i<a.length ? i : null; initCur(); render();
  }
  else if(act==='undo'){
    const e=stepsFor()[wk.step], a=getDraft().ex[e.id]||[];
    a.pop(); saveDraft(); clearRest(); wk.editing=null; initCur(); render();
  }
  else if(act==='skiprest'){ clearRest(); render() }
  else if(act==='mood'){ getDraft().energy=+b.dataset.v; saveDraft(); buzz(10); render() }
  else if(act==='swapopen'){ wk.sheet=true; render() }
  else if(act==='sheetclose'){ if(e.target.closest('[data-stop]') && !b.classList.contains('btn')) return; wk.sheet=false; render() }
  else if(act==='swap'){
    const cur=stepsFor()[wk.step], slot=cur.slot||cur.id, d2=getDraft(), id=b.dataset.id;
    if(id===slot) delete d2.swaps[slot]; else d2.swaps[slot]=id;
    saveDraft(); wk.sheet=false; wk.editing=null; clearRest(); initCur(); render(); toast('Swapped to '+EXMAP[id].name);
  }
  else if(act==='deload'){ const d2=getDraft(); d2.deload=!d2.deload; saveDraft(); render() }
  else if(act==='connect') connectToken();
  else if(act==='disconnect'){ try{localStorage.removeItem('wt.token')}catch(err){} toast('Disconnected'); render() }
  else if(act==='sync') syncNow(true);
  else if(act==='sbin'){
    const em=($('#sbEmail').value||'').trim(), pw=$('#sbPass').value||'';
    if(!em||!pw) return toast('Enter email and password');
    sbSignIn(em,pw).then(async()=>{ toast('Signed in ✅'); await loadRepo() }).catch(err=>toast(err.message||'Sign in failed'));
  }
  else if(act==='sbout'){ try{localStorage.removeItem('wt.sb')}catch(err){} st.sb=[]; toast('Signed out'); render() }
  else if(act==='refresh') refreshApp();
  else if(act==='del'){ const x=allSessions().find(s=>s.id===b.dataset.id); if(x && confirm('Delete '+x.name+' on '+fmtDate(x.date)+'? This removes it everywhere.')) deleteWorkout(x.id) }
  else if(act==='resttoggle'){ SS('wt.rest',!restOn()); if(restOn()===false) clearRest(); render() }
  else if(act==='save') save();
  else if(act==='copy') copyUnsynced();
});

function save(){
  const base=sessBase(st.sess), S=PLAN.sessions[base], d=getDraft();
  const rec={id:sid(), date:st.date, session:st.sess, name:sessName(st.sess), type:S.type,
    energy:num(d.energy), notes:(d.notes||'').trim()||undefined, savedAt:new Date().toISOString(), updatedAt:new Date().toISOString()};
  if(S.type==='lift'){ if(d.firstAt && d.lastAt){const m=Math.max(1,Math.round((d.lastAt-d.firstAt)/60000)); if(m<300) rec.durationMin=m} else if(d.dur) rec.durationMin=d.dur }
  if(d.savedAt) rec.savedAt=d.savedAt;
  if(S.type==='yoga'){
    const min=num(d.run.min);
    if(min==null) return toast('Enter the class length');
    rec.yoga={minutes:min};
  } else if(S.type==='run'){
    const dist=num(d.run.dist), min=num(d.run.min);
    if(dist==null && min==null) return toast('Enter distance or time');
    rec.run={distanceKm:dist, minutes:min};
  } else if(S.type==='lift'){
    rec.entries=[];
    S.ex.forEach(slotEx=>{
      [slotEx.id,...(ALTS[slotEx.id]||[]).map(n=>altId(slotEx.id,n))].forEach(id=>{
        const sets=(d.ex[id]||[]).map(s=>({w:num(s.w)||0,r:num(s.r)})).filter(s=>s.r!=null);
        if(sets.length) rec.entries.push({id,name:EXMAP[id].name,...(id!==slotEx.id?{slot:slotEx.id}:{}),sets});
      });
    });
    if(d.deload) rec.deload=true;
    if(!rec.entries.length) return toast('Nothing logged yet');
  } else return toast('Rest day');
  burstAt($('#saveBtn'),50); buzz([40,50,40]);
  st.local=st.local.filter(x=>x.id!==rec.id); st.local.push(rec); SS('wt.local.v1',st.local);
  delete st.draft[rec.id]; saveDraft();
  clearRest(); st.wk=null; st.tab='history';
  setTimeout(()=>{render();toTop();toast('Saved 🎉'); if(getToken()) setTimeout(()=>syncNow(),900); if(sbAuth()) sbUpsert([rec]).then(ok=>{ if(!ok) toast('Saved here. Cloud sync will retry') })},350);
}
async function copyUnsynced(){
  const txt='Log these workouts into the tracker repo:\n'+JSON.stringify(st.local,null,1);
  try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it into chat.')}
  catch(e){prompt('Copy this:',txt)}
}

['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); const t=await r.text();
    const m=/const APP_VERSION='([0-9.\-]+)'/.exec(t);
    if(m && m[1]!==APP_VERSION) document.getElementById('upd').hidden=false;
  }catch(e){}
}
function refreshApp(){ location.replace(location.pathname+'?r='+Date.now()) }
document.getElementById('updBtn').addEventListener('click',refreshApp);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate() });
/* ---------- pull to refresh (History) ---------- */
(()=>{
  const sc=$('#scroll'), ptr=document.createElement('div'); ptr.id='ptr'; sc.prepend(ptr);
  const PULL=60; let y0=null, dy=0, busy=false;
  sc.addEventListener('touchstart',e=>{ y0=(st.tab==='history'&&!busy&&sc.scrollTop<=0)?e.touches[0].clientY:null; dy=0 },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(y0==null) return;
    dy=Math.max(0,(e.touches[0].clientY-y0)*0.5);
    if(sc.scrollTop>0){ dy=0 }
    ptr.style.transition='none'; ptr.style.height=Math.min(80,dy)+'px'; ptr.classList.toggle('ready',dy>=PULL);
  },{passive:true});
  sc.addEventListener('touchend',async()=>{
    if(y0==null) return; y0=null; ptr.style.transition='';
    if(dy<PULL){ ptr.style.height='0'; return }
    busy=true; ptr.classList.remove('ready'); ptr.classList.add('spin'); ptr.style.height='40px'; buzz(10);
    try{ await loadRepo() }catch(e){}
    render(); busy=false; ptr.classList.remove('spin'); ptr.style.height='0'; toast('History up to date');
  });
})();
render(); loadRepo(); checkUpdate();
</script>
