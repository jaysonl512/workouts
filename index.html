<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Session">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Session</title>
<style>
:root{--bg:#0f1216;--card:#171c22;--line:#262d36;--text:#e8edf2;--mute:#8b97a5;--acc:#ef4444;--acc2:#fb923c;--warn:#fbbf24;--r:16px;--ease:cubic-bezier(.2,.9,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
header{padding:calc(20px + env(safe-area-inset-top)) 20px 10px;max-width:640px;margin:0 auto}
header h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.8px;line-height:1.1}
header span{display:block;color:var(--mute);font-size:14px;margin-top:4px;min-height:20px}
body.wk header{display:none}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
main{padding:6px 16px 28px;max-width:640px;margin:0 auto}
body.wk main{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
nav{flex:none;display:flex;background:#0c0f13;border-top:1px solid var(--line);padding-bottom:min(env(safe-area-inset-bottom),34px);z-index:5}
body.wk nav{display:none}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--mute);padding:12px 0 10px;font-size:12px;font-weight:700;letter-spacing:.2px;transition:color .2s}
nav button svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
nav button.on{color:var(--acc)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}
nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 5px 5px;background:var(--acc)}
.week{padding:12px 10px 14px}
.wkhd{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.wkhd b{font-size:14px}
.wkhd button{background:none;border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{background:none;border:2px solid transparent;border-radius:14px;padding:8px 0 7px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.days small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.days b{font-size:18px;color:var(--text)}
.days i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.days button.done i{background:var(--acc);box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.days button.sel{border-color:var(--acc);background:rgba(239,68,68,.1)}
.days button.today b{color:var(--acc)}
select.big{height:52px;font-weight:600}
button{font-family:inherit;cursor:pointer;transition:transform .12s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.95)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
select,input,textarea{width:100%;background:#0f1318;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:transparent}
.note{color:var(--mute);font-size:13px;margin-top:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn.big{padding:18px;font-size:19px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#223;color:var(--acc2);margin-left:6px;vertical-align:middle}
.pill.loc{background:#2a2210;color:var(--warn)}
.hist .top{display:flex;justify-content:space-between;gap:8px}
.hist h3{margin:0;font-size:16px}
.hist .d{color:var(--mute);font-size:13px}
.hist details summary{cursor:pointer;list-style:none}
.hist details summary::-webkit-details-marker{display:none}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ln b{font-weight:600}.ln span{color:var(--mute);text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#e8edf2;color:#0f1216;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:.25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.wk .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-10px)}
body.wk .toast.show{transform:translate(-50%,0)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
svg{display:block}
.chart{width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500;font-size:12px;border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:20px}.stat span{color:var(--mute);font-size:12px}

/* ---- start card ---- */
.hero{background:linear-gradient(160deg,#2a1416,#171c22 60%);border:1px solid #4a2226;border-radius:20px;padding:20px;margin:12px 0;animation:rise .4s var(--ease)}
.hero h2{margin:0 0 4px;font-size:26px;letter-spacing:-.4px}
.hero .meta{color:var(--mute);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chips span{background:#0f1318;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--mute)}
.chips span.ok{border-color:var(--acc);color:var(--acc)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---- workout flow ---- */
.wkTop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.xbtn{background:#171c22;border:1px solid var(--line);color:var(--mute);width:36px;height:36px;border-radius:12px;font-size:18px;flex:none}
.seg{display:flex;gap:5px;flex:1}
.seg i{flex:1;height:7px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
.seg i::after{content:"";position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.seg i.done::after{transform:scaleX(1)}
.seg i.now{background:#415062}
.stage{animation:inR .3s var(--ease)}
.stage.l{animation-name:inL}
.stage.noanim{animation:none}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.kicker{color:var(--mute);font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.stage h2{margin:2px 0 4px;font-size:27px;line-height:1.15;letter-spacing:-.4px}
.tgt{color:var(--mute);font-size:14px}
.last{font-size:13px;margin-top:10px;color:var(--acc2)}
.last .hint{color:var(--warn);display:block;margin-top:2px}
.badge{display:inline-block;margin-top:8px;background:#2b2410;color:var(--warn);border:1px solid #5a4a14;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;animation:badge .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes badge{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.dot{min-width:56px;padding:9px 10px;border-radius:14px;border:2px dashed var(--line);text-align:center;font-size:13px;font-weight:600;color:var(--mute);background:transparent}
.dot.done{border:2px solid var(--acc);color:var(--text);background:rgba(239,68,68,.1)}
.dot.now{border:2px solid var(--acc2);color:var(--acc2);animation:glow 1.6s ease-in-out infinite}
.dot.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.dot small{display:block;font-size:10px;font-weight:600;color:var(--mute);margin-top:1px;text-transform:lowercase}
.dot.editt{border:2px solid #fbbf24;color:#fbbf24}
/* Active workout: compact header, badges, one-line history, and a single scrolling row of sets */
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.xs{width:auto;padding:6px 11px;font-size:13px;border-radius:10px}
.stage h2.wname{margin:0 0 6px;font-size:24px}
.chips3{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;color:var(--mute);background:#151a20;border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.ss{color:var(--acc);border-color:rgba(239,68,68,.4)}
.chip.pr{color:var(--warn);background:#2b2410;border-color:#5a4a14}
.wnote{font-size:12px;color:var(--mute);margin-top:6px}
.lastd{margin-top:8px;font-size:13px}
.lastd summary{list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc2);cursor:pointer}
.lastd summary::-webkit-details-marker{display:none}
.lastd summary span{color:var(--mute);font-weight:700;margin-right:6px}
.lastfull{margin-top:6px;background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lastfull>small{color:var(--mute);font-size:12px}
.lastfull div{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:2px 0;font-size:13px}
.lastfull div span,.lastfull div small{color:var(--mute)}
.wub,.tline{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 8px 7px 12px;border-radius:12px;font-size:15px;min-height:38px}
.wub{background:#14181d;border:1px dashed #3a4350}
.tline{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3)}
.tline.edit{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.55)}
.wub>span,.tline>span{color:var(--mute);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.wub b,.tline b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wub .link,.tline .link{padding:4px 6px;color:var(--acc2);text-decoration:none;font-weight:700}
.tline em{font-style:normal;font-size:11px;font-weight:700;color:#fbbf24}
.twhy{font-size:12px;color:var(--mute);margin:4px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:10px -16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;min-width:54px;padding:7px 8px}
.dot.wu{min-width:46px;padding:5px 7px;font-size:12px;border:1px dashed #3a4350;color:var(--mute)}
.dot.wu.done{border:1px solid #4b5563;background:transparent;color:var(--mute)}
.dot.wu.now{border:2px solid var(--acc2);color:var(--acc2)}
.dot.skip{text-decoration:line-through;opacity:.45}
.dsep{flex:none;width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.rate{margin:14px 0 4px}.rate>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}.rate small{opacity:.7}
@keyframes pop{0%{transform:scale(.4);background:rgba(239,68,68,.6)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(251,146,60,.14)}}
.steppers{display:grid;grid-template-columns:1fr;gap:8px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 10px 8px}
.stp .lbl{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase;text-align:center;margin-bottom:2px}
.stp .ctl{display:flex;align-items:center;gap:10px}
.stp button{flex:none;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:#0f1318;color:var(--text);font-size:30px;font-weight:300;line-height:1}
.stp button:active{background:#2a1717;border-color:var(--acc)}
.stp input{flex:1;min-width:0;text-align:center;font-size:40px;font-weight:800;letter-spacing:-1px;background:transparent;border:0;padding:0;height:54px}
.stp input:focus{outline:0}
.stp input.bump{animation:bump .18s var(--ease)}
@keyframes bump{50%{transform:scale(1.12);color:var(--acc)}}
.stp .unit{text-align:center;color:var(--mute);font-size:12px;margin-top:0}
.rest{display:flex;align-items:center;gap:14px;background:#241512;border:1px solid #4a2a1c;border-radius:16px;padding:10px 14px;margin:12px 0 0;animation:rise .3s var(--ease)}
.rest .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rest .s{color:var(--mute);font-size:13px}
.rest button{margin-left:auto;background:none;border:1px solid #6b3a22;color:var(--acc2);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:#3a2417}
.ring .fg{stroke:var(--acc2);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.logwrap{margin-top:10px}
.btn.log{box-shadow:0 8px 24px rgba(239,68,68,.22)}
.btn.log.ok{animation:ok .55s var(--ease)}
@keyframes ok{0%{transform:scale(1)}30%{transform:scale(.94)}60%{transform:scale(1.04);filter:brightness(1.2)}100%{transform:scale(1)}}
.btn.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nav3{display:flex;gap:10px;margin-top:8px}
.nav3 button{flex:1}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(239,68,68,.2);transform:scale(1.02)}}
.link{background:none;border:0;color:var(--mute);font-size:13px;padding:10px 6px;text-decoration:underline}
.moods{display:flex;gap:8px;margin:6px 0 14px}
.moods button{flex:1;font-size:26px;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.moods button.on{border-color:var(--acc);background:rgba(239,68,68,.12);transform:scale(1.07)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.sum .stat{padding:12px 14px}.sum .stat b{font-size:28px}
.sum .stat{animation:rise .45s var(--ease) backwards}
.sum .stat:nth-child(2){animation-delay:.07s}.sum .stat:nth-child(3){animation-delay:.14s}.sum .stat:nth-child(4){animation-delay:.21s}
.burst{position:fixed;z-index:40;pointer-events:none}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;animation:fly 1.05s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),calc(var(--dy) + 130px)) rotate(var(--r));opacity:0}}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hdr .btn{flex:none;margin-top:4px}
.sug{margin-top:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:9px 12px;font-size:15px}
.sug small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#161b21;border-radius:24px 24px 0 0;width:100%;max-width:640px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .3s var(--ease)}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .note{margin-bottom:12px}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;font-weight:600;text-align:left}
.opt.cur{border-color:var(--acc);background:rgba(239,68,68,.1)}
.opt small{color:var(--mute);font-weight:500}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.dl{border-color:#5a4a14;background:#221d0d}
.tools2{display:flex;gap:8px;margin-top:10px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row2 .btn{flex:none;min-width:64px}
.sep{height:1px;background:var(--line);margin:14px 0}
.sw{flex:none;width:51px;height:31px;border-radius:99px;border:0;padding:0;background:#3a434e;position:relative;transition:background .2s var(--ease)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw.on{background:#22c55e}.sw.on i{transform:translateX(20px)}
.sstag{color:var(--acc);font-weight:700}
.ssnote{font-size:13px;color:var(--mute);background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0 2px}.ssnote b{color:var(--text)}
.set summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.set summary::-webkit-details-marker{display:none}
.set summary span{color:var(--mute);font-size:14px}

.sect{font-size:13px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);margin:26px 4px 8px}
.sect:first-child{margin-top:8px}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow .dn{width:36px;font-weight:800;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.dayrow .dt{flex:1;font-weight:600}
.dayrow.now{background:rgba(239,68,68,.09);border-radius:12px;border-top-color:transparent}
.dayrow.now+.dayrow{border-top-color:transparent}
.dayrow.now .dn{color:var(--acc)}
.tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#222a33;color:var(--mute)}
.tag.lift{background:rgba(239,68,68,.16);color:#ff8f8f}
.tag.run{background:rgba(251,146,60,.16);color:var(--acc2)}
.tag.ok{background:rgba(34,197,94,.14);color:#4ade80}
button.dayrow{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--text);font:inherit;text-align:left}
.dayrow .dt small,.mute{color:var(--mute);font-weight:500}
.pname{font-size:18px}
.hrest{font-size:13px;color:var(--mute);padding:4px 6px 8px}
.kick{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.upc{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fcd34d;border-radius:12px;padding:9px 12px;font-size:13px;margin:8px 0}
.warn.soft{background:transparent;border-color:var(--line);color:var(--mute)}
.warnc{color:#fcd34d}
.exn small.sub,small.sub{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.exc{display:flex;align-items:center;gap:6px;flex:none}
.mini{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:2px}
.mini button,.ibtn{background:#0f1318;border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:8px;font-size:15px;line-height:1;padding:0}
.mini button{border:0;background:none;width:26px}
.mini b{min-width:12px;text-align:center}
.ibtn{color:var(--mute)}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

<script>
const SESS_KEYS = ['upperA','run','lowerA','upperB','lowerB','run2','yoga','rest'];
const sessBase = k => Programs.baseKey(k);
/* Workouts outside the plan: started or logged from the + button. Yoga keeps its own type; the rest are type 'other'. */
const OTHERS = {yoga:{name:'Hot yoga',e:'🔥'}, hiit:{name:'HIIT',e:'⚡'}, cycling:{name:'Cycling',e:'🚴',dist:1}, walk:{name:'Walk',e:'🚶',dist:1}, sports:{name:'Sports',e:'🏀'}, mobility:{name:'Mobility',e:'🧘'}, other:{name:'Other',e:'✏️'}};
const isOther = k => !!OTHERS[k] && k!=='yoga';
/* The week's planned workouts, in order. Five are the goal; the second run is optional. */
const WEEK_SLOTS = ['upperA','run','lowerA','upperB','lowerB','run2'];
const sessName = k => isOther(k) ? OTHERS[k].name : sessBase(k)==='run' ? 'Run' : sessDef(k).name + (/~\d+$/.test(k||'') ? ' (again)' : '');
/* A workout's definition: the training program's version (programs.js: exercises and set counts for that week),
   else plan.js. Runs, yoga and rest come from plan.js. */
function sessDef(k){
  if(isOther(k)) return {name:OTHERS[k].name, type:'other', note:''};
  const b=sessBase(k);
  if(b==='run'||b==='yoga'||b==='rest') return PLAN.sessions[b];

async function sbUpsert(list){

    const t=await sbToken(); const uid=t&&jwtSub(t); if(!uid) return false;
    await rekeyList(list);

    if(!r.ok) return false;
    list.forEach(x=>{ const i=st.sb.findIndex(y=>y.id===x.id); if(i>=0) st.sb[i]=x; else st.sb.push(x) });
    st.local=st.local.filter(l=>!list.some(x=>x.id===l.id&&verOf(x)>=verOf(l))); SS('wt.local.v1',st.local);

/* Before uploading: a workout whose id (date-key) is already used in the cloud by a different finished workout
   (another uid, e.g. the same lift logged on the Watch while this phone was offline) moves to the next free key,
   upperA~2. Nothing is overwritten and nothing is saved twice (programs.js rekey). */
async function rekeyList(list){
  const ids=list.filter(x=>x.uid).map(x=>x.id); if(!ids.length) return;
  const r=await sbFetch('/rest/v1/sessions?select=id,date,status,uid:data->>uid&id=in.('+ids.map(i=>'"'+encodeURIComponent(i)+'"').join(',')+')');
  if(!r.ok) return;
  const rows=await r.json();
  for(const x of list){
    const row=rows.find(y=>y.id===x.id); if(!row) continue;
    const day=await sbFetch('/rest/v1/sessions?select=id&date=eq.'+x.date); if(!day.ok) continue;
    const taken=new Set([...(await day.json()).map(y=>y.id), ...allSessions().filter(y=>y.date===x.date).map(y=>y.id)]);
    const k=Programs.rekey(x, row, taken); if(!k) continue;
    const old=x.id; x.session=k; x.id=x.date+'-'+k; if(!/\(again\)$/.test(x.name)) x.name+=' (again)';
    st.local=st.local.map(l=>l.id===old && l.uid===x.uid ? {...x} : l); SS('wt.local.v1',st.local);
    toast('Saved as a second '+x.name.replace(/ \(again\)$/,''));
  }
}
/* Upload workouts saved on this device while offline or signed out. A copy the cloud already has (same or newer) is dropped. */

async function syncLocal(manual){
  if(!sbAuth()){ if(manual) toast('Sign in to your cloud account first (Plan tab)'); return false }
  if(syncingLocal) return false;
  syncingLocal=true;

    const sbm=new Map(st.sb.map(x=>[x.id,x]));
    const up=st.local.filter(x=>{ if(isDeleted(x)) return false; const y=sbm.get(x.id); return !y || (contentOf(x)!==contentOf(y) && verOf(x)>=verOf(y)) });
    st.local=st.local.filter(x=>up.includes(x)); SS('wt.local.v1',st.local);

const restOn = () => LS('wt.rest', false);
/* ---------- workout flow ---------- */
const stepsFor = () => {

    // (Plan > exercise preferences) unless swapped for this session. Anything logged stays visible.
    const d=getDraft(), ex=d.only ? Programs.exList(S, d.only) : S.ex;
    const steps=ex.map(e=>{ const a=d.swaps[e.id]??e.use; return a&&a!==e.id&&EXMAP[a] ? {...EXMAP[a], sets:e.sets, reps:e.reps} : e });
    Object.keys(d.ex).forEach(id=>{ if((d.ex[id]||[]).length && EXMAP[id] && !steps.some(x=>x.id===id) && !ex.some(e=>e.id===EXMAP[id].slot && (d.swaps[e.id]??e.use)===id)) steps.push(EXMAP[id]) });
    return steps;
  }
  return S.type==='run' ? [{id:'run',run:1,name:sessName(st.sess)}] : S.type==='yoga' ? [{id:'yoga',yoga:1,name:S.name}] : S.type==='other' ? [{id:'other',other:1,name:sessLabel()}] : [];
};
/* Display name for the selected session; 'other' carries a name typed in the + sheet. */
const sessLabel = () => st.sess==='other' ? (getDraft().label||'Other') : sessName(st.sess);

  st.auto=false;

  const steps=stepsFor();
  let first=0;
  if(resume){ const i=steps.findIndex(e=>!e.run && !e.yoga && !e.other && workSets(d.ex[e.id]).length<planN(e)); first = i<0? steps.length : i }
  st.wk={step:first,dir:1,anim:true,editing:null,editT:null,just:null,rest:null,cur:null,prs:{}};
  initCur(); document.body.classList.add('wk'); render(); toTop();

}
function exitWorkout(){ clearRest(); st.wk=null; document.body.classList.remove('wk'); render(); toTop() }
function goStep(i,dir){
  const steps=stepsFor(); const n=steps.length;
  st.wk.step=Math.max(0,Math.min(n,i)); st.wk.dir=dir; st.wk.anim=true; st.wk.editing=null; st.wk.editT=null; st.wk.just=null;

}
function initCur(){
  const e=stepsFor()[st.wk.step]; if(!e||e.run||e.yoga||e.other){ if(e&&e.yoga){const d0=getDraft(); if(d0.run.min===''){d0.run.min=60;saveDraft()}} st.wk.cur=null;return}
  const wk=st.wk, a=getDraft().ex[e.id]||[];

  if(wk.editT!=null){ const t=targetAt(planOf(e), wk.editT); wk.cur={w:t&&t.w!=null?t.w:'', r:t?t.r:e.reps[0]}; return }
  const it=nextItem(e), lw=workSets(a).slice(-1)[0], last=lastFor(e.id), lastW=last&&workSets(last.sets).slice(-1)[0];
  if(it.t) wk.cur={w: it.t.w!=null ? it.t.w : (lw?lw.w:''), r:it.t.r};
  else { const src=lw || lastW; wk.cur={w:src?.w??0, r:src?.r??e.reps[0]} }
}
let restTimer=null;
function clearRest(){ clearInterval(restTimer); restTimer=null; if(st.wk) st.wk.rest=null }
function startRest(secs){

  restTimer=setInterval(tickRest,250);
}
function tickRest(){

  const left=Math.ceil((r.end-Date.now())/1000);

  const t=$('#restT'), fg=$('#restFg');

/* Live clock on a timed workout (HIIT, walk, ...) started from the + button. */
setInterval(()=>{ const el=document.getElementById('elT'); if(el&&st.wk){ const d=getDraft(); if(d.startedAt) el.textContent=mmss(Math.floor((Date.now()-d.startedAt)/1000)) } },1000);

/* Supersets: two neighbouring exercises with the same `superset` tag (alternates keep their slot's tag).
   Sets alternate A, B, rest, A, B, rest... */
const ssTag = e => e && (e.superset || (e.slot && EXMAP[e.slot]?.superset)) || null;
function ssPartner(i){
  const steps=stepsFor(), t=ssTag(steps[i]); if(!t) return null;
  if(ssTag(steps[i+1])===t) return i+1;
  if(ssTag(steps[i-1])===t) return i-1;

}
function moveStep(i){ const wk=st.wk; wk.dir=i>wk.step?1:-1; wk.step=i; wk.anim=true; wk.editing=null; wk.editT=null; wk.just=null; initCur(); render(); toTop() }
function logSet(){
  const wk=st.wk, e=stepsFor()[wk.step], d=getDraft(), a=(d.ex[e.id] ||= []);
  const w=num(wk.cur.w)||0, r=num(wk.cur.r);
  const btn=$('#logBtn');
  if(!r||r<=0){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); return }
  if(wk.editT!=null){   // editing a future set's target: the original target stays in the plan too
    const p=planOf(e); p.edits ||= {}; p.edits[wk.editT]={w, r};
    wk.editT=null; saveDraft(); initCur(); render(); toast('Target updated'); return;
  }
  const wasEdit = wk.editing!=null, idx = wasEdit ? wk.editing : a.length;
  let set;
  if(wasEdit) set={...a[idx], w, r};                     // keeps its targets and warm-up flag
  else { const it=nextItem(e); set={w, r};
    if(it.wu) set.wu=true;
    if(it.orig){ if(it.orig.w!=null) set.pw=it.orig.w; set.pr=it.orig.r }
    if(it.t){ if(it.t.w!=null) set.tw=it.t.w; set.tr=it.t.r } }
  const be=bestEver(e.id), others=workSets(a.filter((_,i)=>i!==idx)).map(x=>x.w||0);
  // A PR beats every earlier working set: heavier, or with less assistance on pull-ups (only once there is history).
  const isPR = !set.wu && (isAssist(e.name) ? be!=null && w<Math.min(be,...others)
    : (()=>{ const prior=Math.max(be||0,...others,0); return w>0 && prior>0 && w>prior })());
  if(!isManual() && !set.wu){ const nowT=Date.now(); if(!d.firstAt) d.firstAt=nowT; d.lastAt=nowT }
  a[idx]=set; saveDraft();
  wk.editing=null; wk.just=idx;
  if(isPR){ wk.prs[e.id]=true; burstAt(btn,44); buzz([30,40,30]); toast('New PR 🏆') }
  else { burstAt(btn,set.wu?6:10); buzz(15); toast(set.wu?'Warm-up done':CHEERS[Math.floor(Math.random()*CHEERS.length)]) }
  const p = wasEdit || set.wu ? null : ssPartner(wk.step), done=workSets(a).length;
  if(p!=null){
    const pe=stepsFor()[p], pn=workSets(d.ex[pe.id]).length, isA=wk.step<p;
    if(pn<planN(pe) && (isA ? pn<done : pn<=done)){
      // A → B straight away; B → rest, then back to A.
      if(!isA && restOn() && !isManual()) startRest(restSecs(e.rest)); else clearRest();
      render();
      setTimeout(()=>{ if(st.wk===wk && wk.step!==p) moveStep(p) }, 450);
      return;
    }
  }
  if(!wasEdit && !set.wu && done<planN(e) && restOn() && !isManual()) startRest(restSecs(e.rest)); else clearRest();
  initCur(); render();
  const nb=$('#logBtn'); if(nb){nb.classList.add('ok')}
}

/* ---------- live handoff: start a lift on the Watch and continue here, or the other way round ----------
   While a lift is in progress, each device uploads it as status in_progress and checks for a newer copy.
   The newest copy wins. A finished workout is never reopened: in-progress updates only touch rows still in progress. */
async function loadLive(){
  const since=new Date(Date.now()-6*3600e3).toISOString();
  const r=await sbFetch('/rest/v1/sessions?select=*&status=eq.in_progress&updated_at=gte.'+encodeURIComponent(since));
  if(!r.ok) return;
  st.live={}; (await r.json()).forEach(row=>{ const x=rowToSess(row); if(x.type==='lift') st.live[x.id]=x });
  try{ await dropDiscarded() }catch(e){}
}
function adoptLive(id,lv){
  const prev=st.draft[id], d=fromSession(lv), started=Date.parse(lv.startedAt||'')||prev?.startedAt||Date.now();
  d.touched=true; d.touchedAt=verOf(lv); d.startedAt=started; delete d.savedAt;
  d.firstAt=Math.min(prev?.firstAt||started, started); d.lastAt=Math.max(prev?.lastAt||0, verOf(lv));
  if(prev){ d.energy=prev.energy; d.effort=prev.effort||d.effort; d.notes=prev.notes||d.notes; d.deload=prev.deload||d.deload }
  d.liveFrom=lv.source||''; d.liveSeen=true;

}
let liveT=null;
function queueLive(){ clearTimeout(liveT); liveT=setTimeout(()=>pushLive().catch(()=>{}),700) }
async function pushLive(){
  const d=st.draft[sid()], S=sessDef(st.sess);
  if(!d||!st.wk||!sbAuth()||isManual()||S.type!=='lift'||!hasDraftData(d)) return;
  const t=await sbToken(), uid=t&&jwtSub(t); if(!uid) return;
  const rec={id:sid(), date:st.date, session:st.sess, name:sessLabel(), type:'lift', source:'web', entries:entriesOf(S,d),
    startedAt:new Date(d.startedAt||Date.now()).toISOString(), updatedAt:new Date(d.touchedAt||Date.now()).toISOString()};
  if(d.deload) rec.deload=true;
  if(d.plans) rec.plans=d.plans;
  if(d.uid) rec.uid=d.uid;
  if(d.occ) rec.occ=d.occ;

  const row={...sessToRow(rec,uid), status:'in_progress'};

  // without a uid); if there is none yet, insert it (never over a finished one or a different workout).
  const same = d.uid ? '&or='+encodeURIComponent(`(data->>uid.eq.${d.uid},data->>uid.is.null)`) : '';

/* A draft that was synced with the cloud whose cloud copy is gone was discarded on another device (the Watch deletes

async function dropDiscarded(){

let pulling=false;
async function pullLive(){
  if(pulling||!st.wk||!sbAuth()||isManual()||sessDef(st.sess).type!=='lift') return;
  pulling=true;
  try{
    const id=sid(), r=await sbFetch('/rest/v1/sessions?select=*&id=eq.'+encodeURIComponent(id));
    if(!r.ok) return;
    const row=(await r.json())[0];
    if(!row){ const d0=st.draft[id]; if(st.wk && sid()===id && d0 && (d0.liveSeen||d0.liveFrom)){ delete st.draft[id]; SS('wt.draft.v1',st.draft); delete st.live[id]; clearRest(); st.wk=null; st.auto=true; render(); toTop(); toast('This workout was discarded on your Watch') } return }
    if(!st.wk||sid()!==id) return;
    const x=rowToSess(row), d=st.draft[id];
    if(verOf(x)<=(d?.touchedAt||0)) return;
    if(!sameWorkout(d,x)) return;   // a different workout under the same id: saving this one gives it its own id
    if(row.status==='complete'){

      delete st.live[id]; delete st.draft[id]; SS('wt.draft.v1',st.draft);

      return;

      const to=i<0?steps.length:i;

}

const MOODS=['😫','😕','😐','🙂','🔥'];
function sessStats(x){
  if(x.yoga||x.other){ const o=x.yoga||x.other; return [[o.minutes??'—','minutes'],...(o.distanceKm?[[o.distanceKm,'km']]:[]),...(x.hk?.activeKcal?[[x.hk.activeKcal,'kcal']]:[]),...(x.hk?.avgHR?[[x.hk.avgHR,'avg bpm']]:[])].slice(0,3) }
  if(x.run){ const p=(x.run.distanceKm&&x.run.minutes)?x.run.minutes/x.run.distanceKm:null; return [[x.run.distanceKm??'—','km'],[runTime(x.run.minutes),'time'],[p?mmss(Math.round(p*60)):'—','/km']] }
  let sets=0,vol=0; (x.entries||[]).forEach(e=>e.sets.forEach(t=>{if(!t.wu) sets++;vol+=setVol(e,t,x.date)}));
  return [[sets,'sets'],[vol>=1000?(vol/1000).toFixed(1)+'k':vol,'lb lifted'],[x.durationMin??'—','minutes']];

/* This week's scheduled workouts (programs.js) with the session that covers each, and the week's goal

/* Session key for a scheduled run on a date: whichever run key is still free that day. */

function pickSess(date){

  if(open){ st.occ=st.draft[open].occ||null; return open.slice(11) }
  // A workout in progress on the Watch shows even when it is not the day's planned one (a repeat, or a swapped day).
  const live=Object.keys(st.live).find(id=>id.startsWith(date+'-') && !all.some(s=>s.id===id));
  if(live){ st.occ=st.live[live].occ||null; return live.slice(11) }

  const day=all.filter(s=>s.date===date && (date<t || !(s.yoga||s.other)));

function woBody(x,kind,compact){
  let body='';

    const st3=sessStats(x);
    if(!compact) body += `<div class="wsum"><span><b>${st3[0][0]}</b> sets</span><span><b>${st3[1][0]}</b> lb lifted</span>${x.deload?'<span>deload week</span>':''}</div>`;
    body += (x.entries||[]).map(e=>`<div class="wex"><b>${esc(EXMAP[e.id]?.name||e.name)}</b><div class="chips2">${e.sets.map(t=>`<span class="sc">${esc(fmtSet(t,e))}</span>`).join('')}</div></div>`).join('');
  } else if(kind==='run'){
    if(x.indoor) body += `<div class="note" style="padding-top:10px">Indoor run (treadmill). Distance and pace from the Watch's motion sensors.</div>`;
    body += runStats(x);
  } else {
    const o=x.yoga||x.other||{}, hk=x.hk||{}, cells=[[o.minutes??'—','minutes']];
    if(o.distanceKm) cells.push([o.distanceKm,'km']);
    if(hk.avgHR) cells.push([hk.avgHR,'avg bpm']);
    if(hk.maxHR) cells.push([hk.maxHR,'max bpm']);
    if(hk.activeKcal) cells.push([hk.activeKcal,'kcal']);
    if(!compact||cells.length>3) body += `<div class="rstats">${cells.map(([v,l])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>`;
  }

}
/* Run stats grid: always shown, including Watch extras (heart rate, energy, climb) when present. */
function runStats(x){
  const r=x.run||{}, hk=x.hk||{}, cells=[];
  const pace = (r.distanceKm&&r.minutes) ? Math.round(r.minutes*60/r.distanceKm) : (x.avgPaceSecPerKm||null);
  cells.push([r.distanceKm??'—','km'],[runTime(r.minutes),'time'],[pace?mmss(pace):'—','/km pace']);
  if(hk.avgHR) cells.push([hk.avgHR,'avg bpm']);
  if(hk.maxHR) cells.push([hk.maxHR,'max bpm']);
  if(hk.activeKcal) cells.push([hk.activeKcal,'kcal']);
  if(x.elevationGainM!=null && !x.indoor) cells.push([Math.round(x.elevationGainM),'m climb']);
  return `<div class="rstats">${cells.map(([v,l])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>`+(x.route?routeMap(x.route):'');
}
/* ---------- run route map ---------- */
// Google encoded polyline (precision 5), as written by the Watch.
function decodeRoute(str){
  const pts=[]; let i=0, lat=0, lng=0;
  const next=()=>{ let r=0, sh=0, b; do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5 }while(b>=32); return (r&1)?~(r>>1):(r>>1) };
  while(i<str.length){ lat+=next(); lng+=next(); pts.push([lat/1e5,lng/1e5]) }
  return pts;
}
// The route is drawn as an SVG line right away; the tile map replaces it when the details open.
function routeMap(route){
  const pts=decodeRoute(route); if(pts.length<2) return '';
  const W=320,H=180,P=14, lat0=pts[0][0]*Math.PI/180;
  const xy=pts.map(([a,b])=>[b*Math.cos(lat0),a]);
  const xs=xy.map(p=>p[0]), ys=xy.map(p=>p[1]), x0=Math.min(...xs), y1=Math.max(...ys);
  const sc=Math.min((W-2*P)/((Math.max(...xs)-x0)||1e-9),(H-2*P)/((y1-Math.min(...ys))||1e-9));
  const d=xy.map((p,k)=>(k?'L':'M')+(P+(p[0]-x0)*sc).toFixed(1)+' '+(P+(y1-p[1])*sc).toFixed(1)).join('');
  return `<div class="rmap" data-route="${esc(route)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>`;
}
let leafletP=null;
const loadLeaflet = () => leafletP ||= Promise.all([
  new Promise((res,rej)=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; l.onload=res; l.onerror=rej; document.head.appendChild(l) }),
  new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc) })
]).then(()=>window.L).catch(e=>{ leafletP=null; throw e });
async function showMaps(root){
  const els=[...root.querySelectorAll('.rmap:not(.live)')]; if(!els.length) return;
  let L; try{ L=await loadLeaflet() }catch(e){ return }   // offline: the SVG line stays
  els.forEach(el=>{
    if(el.classList.contains('live') || !el.isConnected) return;
    el.classList.add('live'); el.innerHTML='';
    const pts=decodeRoute(el.dataset.route);
    const m=L.map(el,{zoomSnap:.25,zoomControl:false,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false,attributionControl:true});
    m.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'dtile',attribution:'© OpenStreetMap'}).addTo(m);
    const line=L.polyline(pts,{color:'#ef4444',weight:4,opacity:.95,lineJoin:'round'}).addTo(m);
    L.circleMarker(pts[0],{radius:5,color:'#fff',weight:2,fillColor:'#22c55e',fillOpacity:1}).addTo(m);
    L.circleMarker(pts[pts.length-1],{radius:5,color:'#fff',weight:2,fillColor:'#ef4444',fillOpacity:1}).addTo(m);
    m.fitBounds(line.getBounds(),{padding:[18,18]});
  });
}

const ico = (k,cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;
const kfmt = v => v>=1000 ? (v/1000).toFixed(v>=100000?0:1).replace(/\.0$/,'')+'k' : String(Math.round(v));
const shortDate = d => new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const numDate = d => new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
const seg = (act,cur,opts) => `<div class="segc">${opts.map(([v,l])=>`<button class="${v===cur?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
const delta = (txt,good) => `<span class="dpill ${good?'up':'down'}">${ico(good?'trend':'down')}${txt}</span>`;
function niceTicks(lo,hi,n=4){
  if(hi-lo < Math.max(1,Math.abs(hi)*0.04)){ const pad=Math.max(1,Math.abs(hi)*0.1); lo=Math.max(0,lo-pad); hi=hi+pad }
  const raw=(hi-lo)/n, mag=10**Math.floor(Math.log10(raw)), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(6));
  return t;
}
let chartN=0;
/* Line + area chart. pts: [{d,v}] oldest first. invert: lower is better (pace), drawn so better is higher. */
function lineChart(pts, fmt, invert){
  const W=320,H=170,L=34,R=10,T=12,B=24, id='g'+(++chartN);
  const vs=pts.map(p=>p.v), ticks=niceTicks(Math.min(...vs),Math.max(...vs)), lo=ticks[0], hi=ticks[ticks.length-1];
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>{ const f=(v-lo)/((hi-lo)||1); return T+(invert?f:1-f)*(H-T-B) };
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
  const base=H-B;
  const area=pts.length>1?`${line}L${x(pts.length-1).toFixed(1)} ${base}L${x(0).toFixed(1)} ${base}Z`:'';
  const every=Math.max(1,Math.ceil(pts.length/5));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444" stop-opacity=".35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#262d36"/><text x="${L-6}" y="${(y(t)+3.5).toFixed(1)}" fill="#8b97a5" font-size="10" text-anchor="end">${fmt(t)}</text>`).join('')}
    ${area?`<path d="${area}" fill="url(#${id})"/>`:''}
    <path d="${line}" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>pts.length>24&&i!==pts.length-1?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?4.5:3.5}" fill="#171c22" stroke="#ef4444" stroke-width="2"/>`).join('')}
    ${pts.map((p,i)=>(i%every===0||i===pts.length-1)&&!(i!==pts.length-1&&pts.length-1-i<every)?`<text x="${x(i).toFixed(1)}" y="${H-6}" fill="#8b97a5" font-size="10" text-anchor="${pts.length>1&&i===0?'start':pts.length>1&&i===pts.length-1?'end':'middle'}">${shortDate(p.d)}</text>`:'').join('')}
  </svg>`;
}
/* Bar chart, current (last) bar highlighted with its value. bars: [{label,v}] */
function barChart(bars, fmt){
  const W=320,H=180,L=34,R=8,T=26,B=22, max=Math.max(...bars.map(b=>b.v),1), ticks=niceTicks(0,max), hi=ticks[ticks.length-1];
  const bw=(W-L-R)/bars.length, gap=Math.min(8,bw*.25), y=v=>T+(1-v/hi)*(H-T-B), every=bars.length>12?2:1;
  const last=bars.length-1, lx=L+last*bw+bw/2, ly=y(bars[last].v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#262d36"/><text x="${L-6}" y="${(y(t)+3.5).toFixed(1)}" fill="#8b97a5" font-size="10" text-anchor="end">${fmt(t)}</text>`).join('')}
    ${bars.map((b,i)=>{ const bx=L+i*bw+gap/2, by=y(b.v), bh=Math.max(b.v?2:0,H-B-by);
      return `<rect x="${bx.toFixed(1)}" y="${(H-B-bh).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${i===last?'#ef4444':'#5c2424'}"/>`+
        ((i%every===0||i===last)&&!(i!==last&&last-i<every)?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" fill="${i===last?'#e8edf2':'#8b97a5'}" font-size="${bars.length>10?9:10}" text-anchor="middle">${b.label}</text>`:''); }).join('')}
    ${bars[last].v?`<g transform="translate(${Math.min(W-R-30,Math.max(L+30,lx)).toFixed(1)},${Math.max(14,ly-12).toFixed(1)})"><rect x="-30" y="-12" width="60" height="20" rx="8" fill="#0f1318" stroke="#3a434e"/><text y="2" fill="#e8edf2" font-size="11" font-weight="700" text-anchor="middle">${fmt(bars[last].v)}</text></g>`:''}
  </svg>`;
}

/* Per-session points for one exercise, oldest first. Est. 1RM uses Epley on the best set. */
function liftPoints(exId){
  const pts=[];
  [...allSessions()].reverse().forEach(s=>{
    const e0=(s.entries||[]).find(x=>x.id===exId); if(!e0||!workSets(e0.sets).length) return;
    const e={...e0, sets:workSets(e0.sets)};
    const top=e.sets.reduce((m,x)=>(heavier(e,x.w||0,m.w||0)||((x.w||0)===(m.w||0)&&x.r>m.r))?x:m, e.sets[0]);
    // 1RM uses the weight actually moved: body weight minus assistance (per arm stays per arm).
    const ld=x=>isAssist(exName(e))?loadOf(e,x.w,s.date):(x.w||0);
    const e1=Math.max(...e.sets.map(x=>Math.round(ld(x)*(1+(x.r||0)/30))));
    pts.push({d:s.date, w:top.w||0, r:top.r, e1, vol:e.sets.reduce((a,x)=>a+setVol(e,x,s.date),0)});
  });
  return pts;
}
function runPoints(){
  return [...allSessions()].reverse().filter(s=>s.run).map(s=>({d:s.date, km:+s.run.distanceKm||0, min:+s.run.minutes||0, indoor:!!s.indoor,
    pace:(s.run.distanceKm&&s.run.minutes)?Math.round(s.run.minutes*60/s.run.distanceKm):null}));
}
function prList(){
  const best=new Map();
  allSessions().forEach(s=>(s.entries||[]).forEach(e=>workSets(e.sets).forEach(x=>{
    const as=isAssist(exName(e)), w=x.w||0;
    if(!as && !(w>0)) return;
    const b=best.get(e.id);
    if(!b||heavier(e,w,b.w)||(w===b.w&&x.r>b.r)) best.set(e.id,{id:e.id,name:exName(e),w,r:x.r,d:s.date,as});
  })));
  // Assisted moves go last: their weight is assistance, not load.
  const key=p=>p.as?-1:p.w*(1+p.r/30);
  return [...best.values()].sort((a,b)=>key(b)-key(a));
}
const prText = p => p.as ? (p.w ? `${p.w} lb assist × ${p.r}` : `Bodyweight × ${p.r}`) : `${p.w} lb × ${p.r}`;

function strengthCard(){
  const have=new Set(); allSessions().forEach(s=>(s.entries||[]).forEach(e=>have.add(e.id)));

  const series=pts.map(p=>({d:p.d,v:p[key]})), cur=series[series.length-1].v, first=series[0].v, diff=cur-first;

    <div class="tiles2"><div>${ico('dumb','acc')}<span>${as?'Least Assistance':'Heaviest Set'}<b>${as?prText({...heavy,as}):heavy.w?heavy.w+' lb × '+heavy.r:heavy.r+' reps'}</b></span></div>
      <div>${ico('layers','acc')}<span>Sessions<b>${pts.length}</b></span></div></div></div>`;

function runCard(){
  const runs=runPoints();
  if(!runs.length) return `<div class="card pcard"><div class="phead">${ico('run','acc')}<b>Run Progress</b></div><div class="note">Log a run and your pace and distance show up here.</div></div>`;
  const m=st.rm||'pace';
  let body='';
  if(m==='weekly'){
    const mon=monOf(todayStr()), weeks=Array.from({length:8},(_,i)=>{ const wm=addDays(mon,-7*(7-i)); return {label:numDate(wm), v:+weekStats(wm).km.toFixed(1)} });
    const cur=weeks[7].v, prev=weeks[6].v;
    body=`<div class="pbig"><b>${cur} km</b><span>This week</span>${prev||cur?delta(`${cur>=prev?'+':'−'}${Math.abs(cur-prev).toFixed(1)} km vs last week`,cur>=prev):''}</div>${barChart(weeks, v=>String(+v.toFixed(1)))}`;
  } else if(m==='pace'){
    const s=runs.filter(r=>r.pace&&r.km>=0.5).map(r=>({d:r.d,v:r.pace}));
    if(!s.length) body=`<div class="note" style="margin:12px 0">Runs need distance and time for pace.</div>`;
    else { const cur=s[s.length-1].v, diff=s[0].v-cur;
      body=`<div class="pbig"><b>${mmss(cur)}</b><span>/km latest pace</span>${s.length>1&&diff!==0?delta(`${mmss(Math.abs(diff))} ${diff>0?'faster':'slower'}`,diff>0):''}</div>${lineChart(s, v=>mmss(Math.round(v)), true)}`; }
  } else {
    const s=runs.map(r=>({d:r.d,v:r.km})), cur=s[s.length-1].v, diff=+(cur-s[0].v).toFixed(2);
    body=`<div class="pbig"><b>${cur} km</b><span>latest run</span>${s.length>1&&diff!==0?delta(`${diff>0?'+':'−'}${Math.abs(diff)} km`,diff>0):''}</div>${lineChart(s, v=>String(+v.toFixed(1)))}`;
  }
  if(m!=='weekly'&&runs.length<2) body+=`<div class="note" style="text-align:center">Your trend shows after your next run.</div>`;
  const longest=runs.reduce((a,r)=>r.km>a.km?r:a,runs[0]), paced=runs.filter(r=>r.pace&&r.km>=1), fastest=paced.length?paced.reduce((a,r)=>r.pace<a.pace?r:a):null;
  return `<div class="card pcard"><div class="phead">${ico('run','acc')}<b>Run Progress</b></div>

      <div><b>${fastest?mmss(fastest.pace):'—'}</b><span>Best pace /km</span></div>
      <div><b>${+runs.reduce((a,r)=>a+r.km,0).toFixed(1)} km</b><span>${runs.length} run${runs.length>1?'s':''} total</span></div></div></div>`;
}

   about:'The tiny variation between heartbeats. Higher usually means you are well recovered. It swings a lot day to day, so watch the trend.'},
  {k:'vo2', col:'vo2max',      name:'Cardio fitness',         short:'Cardio fitness',lc:'cardio fitness',  unit:'VO₂ max', ico:'gauge', better:1,  min:0.5, dec:1,
   about:'Estimated VO₂ max (ml/kg/min). Your Watch updates it after outdoor walks, runs and hikes. Higher is better.'},
  {k:'rec', col:'hr_recovery', name:'Heart rate recovery',    short:'HR recovery',lc:'heart rate recovery',     unit:'bpm',     ico:'timer', better:1,  min:2,   dec:0,
   about:'How far your heart rate drops in the first minute after a workout. A bigger drop is better.'},
  {k:'wt',  col:'weight_kg',   name:'Weight',                 short:'Weight',lc:'weight',          unit:'lb',      ico:'scale', better:0,  min:1,   dec:1,

];
const hNum = v => v==null||v==='' ? null : +v;
async function loadHealth(){
  const r=await sbFetch('/rest/v1/health_daily?select=date,rhr,hrv,vo2max,hr_recovery,weight_kg&date=gte.'+addDays(todayStr(),-400)+'&order=date.asc');
  if(!r.ok) return;
  st.health=(await r.json()).map(h=>{ const o={d:h.date}; HM.forEach(m=>{ const v=hNum(h[m.col]); o[m.k]=v==null?null:m.k==='wt'?Math.round(v*2.20462*10)/10:v }); return o });
  SS('wt.health.v1',st.health);

const hAvg = a => a.reduce((x,y)=>x+y,0)/a.length;
const hFmt = (m,v) => (+v).toFixed(m.dec).replace(/\.0$/,'');
const hSeries = (k,since) => st.health.filter(h=>h[k]!=null&&(!since||h.d>=since)).map(h=>({d:h.d,v:h[k]}));
/* Now vs about 4 weeks earlier. Noisy daily values (resting HR, HRV) use 7-day averages. */
function hTrend(m){
  const s=hSeries(m.k); if(!s.length) return null;
  const last=s[s.length-1].d;
  const cur = m.smooth ? hAvg(s.filter(p=>p.d>addDays(last,-7)).map(p=>p.v)) : s[s.length-1].v;
  let base=s.filter(p=>p.d<=addDays(last,-21)&&p.d>addDays(last,-35));
  if(!base.length && s[0].d<=addDays(last,-10)) base=s.filter(p=>p.d<addDays(s[0].d,7));
  const out={cur,last,n:s.length};
  if(!base.length) return out;
  const diff=+(cur-hAvg(base.map(p=>p.v))).toFixed(m.dec);
  out.diff=diff; out.since=base[0].d;
  out.tone = Math.abs(diff)<m.min ? 'flat' : !m.better ? 'flat' : diff*m.better>0 ? 'good' : 'bad';
  return out;
}
function hChange(m,t){
  if(t.diff==null) return {txt:'Trend shows after a couple of weeks', tone:''};
  if(Math.abs(t.diff)<m.min) return {txt:`Steady since ${shortDate(t.since)}`, tone:'flat'};
  return {txt:`${t.diff>0?'↑':'↓'} ${hFmt(m,Math.abs(t.diff))} ${m.unit==='VO₂ max'?'':m.unit} since ${shortDate(t.since)}`.replace('  ',' '), tone:t.tone};
}
function healthCard(){
  const head=`<div class="phead">${ico('heart','acc')}<b>Health Trends</b></div>`;
  if(!sbAuth()) return `<div class="card pcard">${head}<div class="note">Sign in to your cloud account on the Plan tab to see trends from Apple Health.</div></div>`;
  const rows=HM.map(m=>[m,hTrend(m)]).filter(([m,t])=>t);

/* Weekly averages vs workouts that week: a pattern in your data, not proof of cause. */
function hCorr(m){
  const mon=monOf(todayStr()), busy=[], light=[];
  for(let i=1;i<=26;i++){
    const wm=addDays(mon,-7*i), vs=st.health.filter(h=>h[m.k]!=null&&h.d>=wm&&h.d<addDays(wm,7)).map(h=>h[m.k]);
    if(vs.length<2) continue;
    (weekStats(wm).sessions>=4?busy:light).push(hAvg(vs));
  }
  if(busy.length<2||light.length<2) return 'Once you have a few weeks of data, this compares your busier training weeks (4+ workouts) with lighter ones.';
  const b=hAvg(busy), l=hAvg(light), d=b-l;
  const f1=v=>Math.abs(d)<m.min*3 ? v.toFixed(m.dec+1) : hFmt(m,v);
  const verdict = Math.abs(d)<m.min ? 'About the same either way.' : !m.better ? '' : d*m.better>0 ? 'Training more lines up with a better number.' : 'Busier weeks line up with a worse number. Check sleep and recovery in those weeks.';
  return `In weeks with 4+ workouts your ${m.lc} averaged <b>${f1(b)} ${m.unit}</b>, vs <b>${f1(l)} ${m.unit}</b> in lighter weeks. ${verdict}`;
}

/* ---------- week & month in review ---------- */
const sessMin = s => s.run ? (+s.run.minutes||0) : (s.yoga||s.other) ? (+(s.yoga||s.other).minutes||0) : (+s.durationMin||0);
const monthStart = ym => ym+'-01';
const monthAdd = (ym,n) => { const [y,m]=ym.split('-').map(Number), d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') };
const monthEnd = ym => addDays(monthStart(monthAdd(ym,1)),-1);
const monthName = ym => new Date(ym+'-15T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const fmtMins = m => { m=Math.round(m); return m>=60 ? Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m' : m+' min' };
const KIND_COL = {lift:'#ef4444', run:'#fb923c', yoga:'#a78bfa', other:'#a78bfa'};
/* Everything a recap shows, for a week (key = its Monday) or a month (key = YYYY-MM). */
function periodReview(kind,key){
  const start = kind==='week' ? key : monthStart(key), end = kind==='week' ? addDays(key,6) : monthEnd(key);
  const pStart = kind==='week' ? addDays(key,-7) : monthStart(monthAdd(key,-1)), pEnd = addDays(start,-1);
  const all=allSessions(), list=all.filter(s=>s.date>=start&&s.date<=end).reverse();
  const agg = L => { const o={n:0,lifts:0,runs:0,extras:0,vol:0,km:0,min:0};
    L.forEach(s=>{ o.n++; o.min+=sessMin(s);
      if(s.run){o.runs++;o.km+=+s.run.distanceKm||0} else if(s.yoga||s.other) o.extras++;
      else {o.lifts++;(s.entries||[]).forEach(e=>e.sets.forEach(x=>o.vol+=setVol(e,x,s.date)))} });
    return o };
  const cur=agg(list), was=agg(all.filter(s=>s.date>=pStart&&s.date<=pEnd));
  // A PR is a heavier set than anything logged for that exercise before this period (first-timers don't count).
  const before=new Map();
  all.filter(s=>s.date<start).forEach(s=>(s.entries||[]).forEach(e=>workSets(e.sets).forEach(x=>{ const b=before.get(e.id); if(b==null||heavier(e,x.w||0,b)) before.set(e.id,x.w||0) })));
  const prs=new Map();
  list.forEach(s=>(s.entries||[]).forEach(e=>workSets(e.sets).forEach(x=>{ const b=before.get(e.id), w=x.w||0, as=isAssist(exName(e));
    if(b!=null&&(as||w>0)&&heavier(e,w,b)){ const p=prs.get(e.id); if(!p||heavier(e,w,p.w)||(w===p.w&&x.r>p.r)) prs.set(e.id,{name:exName(e).split(/ [\/(]/)[0],w,r:x.r,as}) } })));
  let gain=null;
  new Set(list.flatMap(s=>(s.entries||[]).map(e=>e.id))).forEach(id=>{
    const pts=liftPoints(id), a=pts.filter(p=>p.d<start).pop(), b=pts.filter(p=>p.d>=start&&p.d<=end).pop();
    if(a&&b&&b.e1>a.e1&&(!gain||b.e1-a.e1>gain.d)) gain={name:(EXMAP[id]?.name||id).split(/ [\/(]/)[0],d:b.e1-a.e1};
  });
  const runs=list.filter(s=>s.run&&+s.run.distanceKm>=1&&+s.run.minutes>0);
  const bestPace=runs.length?Math.min(...runs.map(s=>Math.round(s.run.minutes*60/s.run.distanceKm))):null;
  const days={}; list.forEach(s=>{ (days[s.date] ||= []).push(kindOf(s)) });
  const R={kind,key,start,end,cur,was,prs:[...prs.values()].sort((a,b)=>(b.as?-1:b.w)-(a.as?-1:a.w)),gain,bestPace,days};
  if(kind==='week'){
    const wp0=weekPlan(start); R.done=wp0.doneN; R.goal=wp0.goal;
    const hit = m => { const w=weekPlan(m); return w.goal>0 && w.doneN>=w.goal };
    let k=0, m=start; while(k<52 && hit(m)){k++;m=addDays(m,-7)} R.streak=k;
  } else {
    const mons=[]; for(let m=monOf(start); m<=end; m=addDays(m,7)) if(m>=start) mons.push(m);
    R.weeks=mons.length; R.weeksHit=mons.filter(m=>{ const w=weekPlan(m); return w.goal>0 && w.doneN>=w.goal }).length;
  }
  const hl=[];
  if(R.prs.length>2){ const p=R.prs[0]; hl.push(`${R.prs.length} new PRs`, `Top PR: ${p.name} ${prText(p)}`) }
  else R.prs.forEach(p=>hl.push(`New PR: ${p.name} ${prText(p)}`));
  if(gain) hl.push(`${gain.name} est. 1RM +${gain.d} lb`);
  if(kind==='week'&&R.streak>=2) hl.push(`${R.streak} weeks in a row at 5/5`);
  if(was.vol>0&&cur.vol>0){ const p=Math.round((cur.vol-was.vol)/was.vol*100); hl.push(`Volume ${p>=0?'up':'down'} ${Math.abs(p)}% vs last ${kind}`) }
  if(!hl.length) hl.push(cur.n?`${cur.n} workout${cur.n>1?'s':''} logged. Keep it rolling.`:'A quiet one. Next one counts.');
  R.highlights=hl;
  return R;
}
/* The share image: 1080 × 1920, the size of a phone story. */
function drawRecap(R){

  x.fillStyle='#0f1216'; x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(W/2,-80,0,W/2,-80,1150); g.addColorStop(0,'rgba(239,68,68,.42)'); g.addColorStop(1,'rgba(239,68,68,0)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const wk=R.kind==='week';
  text(wk?'WEEK IN REVIEW':'MONTH IN REVIEW',P,180,F(800,40),'#ef4444');
  const title = wk ? (()=>{ const a=new Date(R.start+'T12:00:00'), b=new Date(R.end+'T12:00:00'), m=d=>d.toLocaleDateString(undefined,{month:'short'});
    return m(a)+' '+a.getDate()+' – '+(m(a)===m(b)?'':m(b)+' ')+b.getDate() })() : monthName(R.key);
  text(title,P,285,F(800,92),'#e8edf2');
  let y;
  if(wk){
    const cx=W/2, cy=575, r=185;
    x.lineWidth=38; x.lineCap='round'; x.strokeStyle='#262d36'; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
    if(R.done>0){ x.strokeStyle='#ef4444'; x.beginPath(); x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,R.done/5)); x.stroke() }
    text(`${R.done}/5`,cx,cy+40,F(800,140),'#e8edf2','center');
    text('workouts',cx,cy+100,F(600,38),'#8b97a5','center');
    const L=['M','T','W','T','F','S','S'], step=(W-2*P)/7;
    L.forEach((l,i)=>{ const X=P+step*i+step/2, k=R.days[addDays(R.start,i)];
      text(l,X,880,F(700,32),'#8b97a5','center');
      x.beginPath(); x.arc(X,945,36,0,Math.PI*2);
      if(k){ x.fillStyle=KIND_COL[k[0]]; x.fill(); if(k.length>1) text('+'+(k.length-1),X,957,F(800,30),'#fff','center') }
      else { x.lineWidth=5; x.strokeStyle='#262d36'; x.stroke() }
    });
    y=1030;
  } else {
    text(String(R.cur.n),W/2,560,F(800,230),'#e8edf2','center');
    text(R.cur.n===1?'workout':'workouts',W/2,625,F(600,40),'#8b97a5','center');
    text(`${R.weeksHit} of ${R.weeks} weeks at 5/5`,W/2,690,F(700,38),'#ef4444','center');
    const step=(W-2*P)/7, first=monOf(R.start);
    ['M','T','W','T','F','S','S'].forEach((l,i)=>text(l,P+step*i+step/2,770,F(700,30),'#8b97a5','center'));
    let row=0;
    for(let d=first; d<=R.end; d=addDays(d,1)){
      const i=(new Date(d+'T12:00:00').getDay()+6)%7, X=P+step*i+step/2, Y=825+row*68;
      if(d>=R.start){ const k=R.days[d]; x.beginPath(); x.arc(X,Y,25,0,Math.PI*2);
        if(k){ x.fillStyle=KIND_COL[k[0]]; x.fill() } else { x.lineWidth=4; x.strokeStyle='#262d36'; x.stroke() } }
      if(i===6) row++;
    }
    y=825+(row+(((new Date(R.end+'T12:00:00').getDay()+6)%7)===6?0:1))*68-10;
  }
  const tiles=[[kfmt(R.cur.vol)+' lb','Lifted'],[(R.cur.km?R.cur.km.toFixed(1).replace(/\.0$/,''):'0')+' km','Running'],[R.bestPace?mmss(R.bestPace)+' /km':'—','Best pace'],[fmtMins(R.cur.min),'Time trained']];
  const tw=(W-2*P-30)/2, th=wk?190:170;
  tiles.forEach(([v,l],i)=>{ const X=P+(i%2)*(tw+30), Y=y+Math.floor(i/2)*(th+26);
    x.fillStyle='#171c22'; x.strokeStyle='#262d36'; x.lineWidth=3; x.beginPath(); x.roundRect(X,Y,tw,th,30); x.fill(); x.stroke();
    text(v,X+36,Y+th/2+12,F(800,wk?68:62),'#e8edf2'); text(l,X+36,Y+th/2+62,F(600,32),'#8b97a5') });
  y+=2*th+26+80;
  const room=Math.max(1,Math.floor((1850-y)/70));
  R.highlights.slice(0,room).forEach((h,i)=>{ const Y=y+i*70;
    x.beginPath(); x.arc(P+12,Y-13,11,0,Math.PI*2); x.fillStyle='#ef4444'; x.fill();

const sheetOpen = (o,act) => { const na=o.shown?' style="animation:none"':''; o.shown=true; return [`<div class="sheetbg" data-act="${act}"${na}><div class="sheet" data-stop="1"${na}>`, `</div></div>`] };
/* Change settings: a copy of the newest config, edited, normalized, with a day order that avoids warnings. */
function editCfg(fn, msg){
  const c=JSON.parse(JSON.stringify(progCfg())), before=JSON.stringify(c.days)+c.lifts+c.template;
  fn(c);
  if(JSON.stringify(c.days)+c.lifts+c.template!==before) c.rotation=Programs.bestRotation(c);
  setProgram({config:Programs.normalize(c), past:(st.prog&&st.prog.past)||[]});
  render(); if(msg) toast(msg);
}

function daySheet(){

      <div class="rbtns" style="margin-top:10px">${x.type==='run'&&x.runKind!=='easy'?`<button class="btn sm ghost" data-act="deasy" data-o="${esc(x.occ)}">Make it an easy run</button>`:''}${x.type==='lift'&&!x.reduced?`<button class="btn sm ghost" data-act="dset" data-o="${esc(x.occ)}" data-k="reduced">Reduce volume</button>`:''}${x.status!=='skipped'?`<button class="btn sm ghost" data-act="dset" data-o="${esc(x.occ)}" data-k="skipped">Skip</button>`:''}${changed&&(changeOf(x.occ)||{}).add&&(x.reduced||x.status==='skipped'||x.status==='recovery'||(changeOf(x.occ)||{}).easier)?`<button class="btn sm ghost" data-act="rdyundo" data-o="${esc(x.occ)}">Undo</button>`:''}${changed?`<button class="btn sm ghost" data-act="drestore" data-o="${esc(x.occ)}">${(changeOf(x.occ)||{}).add?'Remove':'Undo changes'}</button>`:''}</div></div>`;

/* A change to one scheduled workout, merged with any earlier change to it. Anything you change yourself is marked
   manual, so a later program switch keeps it unless you choose otherwise. */
function setOcc(occ, patch, source, date){
  const prev=changeOf(occ)||{}, ws=prev.week||sched(date||st.date).weekStart;
  putChanges([{id:occ, change:{...prev, ...patch, week:ws, source: source==='manual'||prev.source==='manual' ? 'manual' : source}}]);
}
/* Undo a readiness or day-sheet choice (reduce, recovery, skip, easier run). A workout added by a switch keeps its
   own row, with its run type put back. */
function undoOcc(occ){

/* Entries in plan order: each slot's planned exercise, then its alternatives (the Watch does the same). */
function entriesOf(S,d){
  const out=[];
  S.ex.forEach(slotEx=>{
    [slotEx.id,...(ALTS[slotEx.id]||[]).map(n=>altId(slotEx.id,n))].forEach(id=>{
      const sets=(d.ex[id]||[]).map(Progression.cleanSet).filter(s=>s.r>0), pl=d.plans&&d.plans[id], df=d.diff&&d.diff[id];
      if(sets.length) out.push({id,name:EXMAP[id].name,...(id!==slotEx.id?{slot:slotEx.id}:{}),sets,...(pl&&pl.state?{prog:pl.state}:{}),...(df?{diff:df}:{})});
    });
  });
  // Anything else logged (an exercise since removed from the workout) is kept, never dropped.
  Object.keys(d.ex).forEach(id=>{ if(out.some(e=>e.id===id) || !EXMAP[id]) return;
    const sets=(d.ex[id]||[]).map(Progression.cleanSet).filter(s=>s.r>0), pl=d.plans&&d.plans[id], df=d.diff&&d.diff[id], sl=EXMAP[id].slot;
    if(sets.length) out.push({id,name:EXMAP[id].name,...(sl&&sl!==id?{slot:sl}:{}),sets,...(pl&&pl.state?{prog:pl.state}:{}),...(df?{diff:df}:{})}); });
  return out;
}
function save(){
  const S=sessDef(st.sess), d=getDraft();
  const rec={id:sid(), date:st.date, session:st.sess, name:sessLabel(), type:S.type,
    energy:num(d.energy), effort:d.effort||undefined, notes:(d.notes||'').trim()||undefined, savedAt:new Date().toISOString(), updatedAt:new Date().toISOString()};
  if(S.type==='lift'){ if(isManual() && d.dur) rec.durationMin=d.dur; else if(d.firstAt && d.lastAt){const m=Math.max(1,Math.round((d.lastAt-d.firstAt)/60000)); if(m<300) rec.durationMin=m} else if(d.dur) rec.durationMin=d.dur }
  if(d.savedAt) rec.savedAt=d.savedAt;
  if(d.uid) rec.uid=d.uid;
  if(d.occ) rec.occ=d.occ;
  if(d.reduced) rec.reduced=true;
  // Editing a Watch session keeps what only the Watch records (Health link, route, indoor, climb).
  const prev=allSessions().find(x=>x.id===rec.id);
  if(prev) ['hk','route','indoor','elevationGainM'].forEach(k=>{ if(prev[k]!=null) rec[k]=prev[k] });
  if(S.type==='yoga'){
    const min=num(d.run.min);
    if(min==null) return toast('Enter the class length');
    rec.yoga={minutes:min};
  } else if(S.type==='other'){
    const min=num(d.run.min), dist=num(d.run.dist);
    if(min==null) return toast('Enter how long it took');
    rec.other={minutes:min}; if(dist) rec.other.distanceKm=dist;
  } else if(S.type==='run'){
    const dist=num(d.run.dist), min=num(d.run.min);
    if(dist==null && min==null) return toast('Enter distance or time');
    rec.run={distanceKm:dist, minutes:min};
  } else if(S.type==='lift'){
    rec.entries=entriesOf(S,d);
    if(d.deload) rec.deload=true;
    if(!rec.entries.length) return toast('Nothing logged yet');
  } else return toast('Rest day');
  burstAt($('#saveBtn'),50); buzz([40,50,40]);
  st.local=st.local.filter(x=>x.id!==rec.id); st.local.push(rec); SS('wt.local.v1',st.local);
  delete st.draft[rec.id]; saveDraft();
  clearRest(); st.wk=null; st.tab='history'; st.auto=true;
  setTimeout(()=>{render();toTop();toast('Saved 🎉'); if(sbAuth()) sbUpsert([rec]).then(ok=>{ if(!ok) toast('Saved here. Cloud sync will retry') })},350);
}

['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); const t=await r.text();
    const m=/const APP_VERSION='([0-9.\-]+)'/.exec(t);
    if(m && m[1]!==APP_VERSION) document.getElementById('upd').hidden=false;
  }catch(e){}
}
function refreshApp(){ location.replace(location.pathname+'?r='+Date.now()) }
document.getElementById('updBtn').addEventListener('click',refreshApp);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; checkUpdate();
  if(st.wk) pullLive(); else if(sbAuth()) loadLive().then(()=>{ if(!st.wk) render() }).catch(()=>{}) });
/* ---------- swipe left on a History workout to show Delete ---------- */
(()=>{
  const W=88; let el=null, sx=0, sy=0, dx=0, moved=false, open=null, eat=false;
  const slide=(w,x)=>{ w.querySelector('details').style.transform = x ? `translateX(${x}px)` : '' };
  const close=()=>{ if(open){ slide(open,0); open=null } };
  app.addEventListener('touchstart',e=>{
    const w=e.target.closest('.wo');
    if(open && open!==w) close();
    el = (w && !e.target.closest('.swdel')) ? w : null; if(!el) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; moved=false;
  },{passive:true});
  app.addEventListener('touchmove',e=>{
    if(!el) return;
    const x=e.touches[0].clientX-sx, y=e.touches[0].clientY-sy;
    if(!moved){ if(Math.abs(x)<10) return; if(Math.abs(y)>Math.abs(x)){ el=null; return } moved=true; el.classList.add('swiping') }
    dx=Math.min(0, Math.max(-W-40, (el===open?-W:0)+x)); slide(el,dx);
  },{passive:true});
  app.addEventListener('touchend',()=>{
    if(!el) return; const w=el; el=null; w.classList.remove('swiping');
    if(!moved) return;
    eat=true; setTimeout(()=>eat=false,400);   // the swipe shouldn't also open the workout
    if(dx < -W/2){ slide(w,-W); open=w } else { slide(w,0); if(open===w) open=null }
  });
  app.addEventListener('click',e=>{ if(eat && e.target.closest('.wo summary')){ e.preventDefault(); e.stopPropagation() } },true);
})();
document.getElementById('undoBtn').addEventListener('click',undoDelete);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') commitDelete() });

/* ---------- pull to refresh (every tab; not during a live workout or inside a sheet) ---------- */
(()=>{
  const sc=$('#scroll'), ptr=document.createElement('div'); ptr.id='ptr'; sc.prepend(ptr);
  const PULL=60; let y0=null, x0=0, dy=0, busy=false;
  const can = e => !busy && sc.scrollTop<=0 && !(st.wk&&st.tab==='today') && !e.target.closest('.sheetbg,.recapbg');
  sc.addEventListener('touchstart',e=>{ y0=can(e)?e.touches[0].clientY:null; x0=e.touches[0].clientX; dy=0 },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(y0==null) return;
    dy=Math.max(0,(e.touches[0].clientY-y0)*0.5);
    if(sc.scrollTop>0 || Math.abs(e.touches[0].clientX-x0)>dy*2){ dy=0 }
    ptr.style.transition='none'; ptr.style.height=Math.min(80,dy)+'px'; ptr.classList.toggle('ready',dy>=PULL);
  },{passive:true});
  sc.addEventListener('touchend',async()=>{
    if(y0==null) return; y0=null; ptr.style.transition='';
    if(dy<PULL){ ptr.style.height='0'; return }
    busy=true; ptr.classList.remove('ready'); ptr.classList.add('spin'); ptr.style.height='40px'; buzz(10);
    try{ await loadData() }catch(e){}
    checkUpdate(); render(); busy=false; ptr.classList.remove('spin'); ptr.style.height='0'; toast('Up to date');
  });
})();
try{localStorage.removeItem('wt.token')}catch(e){}  // GitHub sync was removed; forget any old token
render(); loadData(); checkUpdate();
addEventListener('online',()=>{ if(st.local.length) syncLocal() });
</script>
